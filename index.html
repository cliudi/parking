<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16232B">
<title>ParkTop — parkovkalar / парковки Ташкента</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232B; --bg:#EEF2F4; --card:#FFF;
    --blue:#1156D6; --teal:#17A398; --amber:#F4A300; --red:#D64541;
    --muted:#6B7A85; --line:#E2E8EB;
    --sh:0 6px 22px rgba(22,35,43,.16);
    --top:env(safe-area-inset-top,0px);
    --bot:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Manrope',sans-serif;color:var(--ink);background:var(--bg)}

  /* карта на весь экран */
  #map{position:fixed;inset:0;z-index:1}
  #map .ymaps-2-1-79-copyright{opacity:.5}

  /* ── плавающая шапка ── */
  .top{position:fixed;top:calc(10px + var(--top));left:10px;right:10px;z-index:60;display:flex;gap:8px}
  .bar{
    flex:1;display:flex;align-items:center;gap:9px;background:var(--card);
    border-radius:14px;padding:9px 12px;box-shadow:var(--sh);min-width:0;
  }
  .logo{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;
    font:800 16px 'Unbounded';display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bar input{border:0;outline:none;background:none;width:100%;font:600 14px 'Manrope';color:var(--ink);min-width:0}
  .bar input::placeholder{color:var(--muted)}
  .lang{
    background:var(--card);border-radius:14px;box-shadow:var(--sh);border:0;
    padding:0 13px;font:800 13px 'Manrope';color:var(--ink);cursor:pointer;flex-shrink:0;
  }

  .chips{position:fixed;top:calc(62px + var(--top));left:10px;right:10px;z-index:60;
    display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:999px;background:var(--card);border:0;
    font:700 12px 'Manrope';color:var(--ink);box-shadow:0 2px 10px rgba(22,35,43,.14);cursor:pointer}
  .chip.on{background:var(--ink);color:#fff}

  /* ── кнопки справа ── */
  .fabs{position:fixed;right:12px;z-index:60;display:flex;flex-direction:column;gap:9px;
    bottom:calc(var(--peek,96px) + 12px + var(--bot));transition:bottom .28s cubic-bezier(.4,0,.2,1)}
  .fab{width:46px;height:46px;border-radius:14px;background:var(--card);border:0;box-shadow:var(--sh);
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .fab:active{transform:scale(.93)}
  .fab.on{background:var(--blue);color:#fff}
  .fab.live{background:var(--teal);color:#fff}

  /* ── нижняя шторка ── */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);
    border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(22,35,43,.16);
    height:var(--peek,96px);transition:height .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;padding-bottom:var(--bot);
  }
  .grab{padding:9px 0 3px;display:flex;justify-content:center;cursor:grab;touch-action:none}
  .grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
  .shead{display:flex;align-items:baseline;justify-content:space-between;padding:2px 18px 9px;cursor:pointer}
  .shead h2{font:600 13.5px 'Unbounded'}
  .shead span{font:700 11.5px 'Manrope';color:var(--muted)}
  #list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 14px;flex:1}
  .row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border:0}
  .dot{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;line-height:1}
  .dot b{font-size:16px}
  .dot small{font-size:7px;font-weight:700;text-transform:uppercase;opacity:.92}
  .rt{flex:1;min-width:0}
  .rt b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt span{font:600 11.5px 'Manrope';color:var(--muted)}
  .rd{font:800 12px 'Manrope';color:var(--blue);white-space:nowrap}
  .empty{padding:26px;text-align:center;color:var(--muted);font:700 13px 'Manrope';line-height:1.6}

  /* ── модалки ── */
  .mask{position:fixed;inset:0;background:rgba(22,35,43,.5);z-index:200;display:none;align-items:flex-end}
  .mask.open{display:flex}
  .modal{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + var(--bot));
    animation:up .26s cubic-bezier(.2,.8,.3,1);max-height:88vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
  .ctop{display:flex;gap:13px;align-items:flex-start;margin-top:6px}
  .ctop .dot{width:54px;height:54px}
  .ctop h3{font:600 15.5px 'Unbounded';line-height:1.3}
  .ctop p{font:600 12px 'Manrope';color:var(--muted);margin-top:3px}
  .stats{display:flex;gap:7px;margin:15px 0}
  .stat{flex:1;background:var(--bg);border-radius:14px;padding:11px 6px;text-align:center}
  .stat b{font:600 14px 'Unbounded';display:block}
  .stat span{font:700 9px 'Manrope';color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .cs{background:var(--bg);border-radius:14px;padding:11px 13px;margin-bottom:13px}
  .cs p{font:700 11.5px 'Manrope';color:var(--muted);margin-bottom:8px}
  .csb{display:flex;gap:8px}
  .csbtn{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    font:800 12.5px 'Manrope';cursor:pointer;color:var(--ink)}
  .csbtn:active{transform:scale(.97)}
  .csbtn.take{border-color:var(--red);color:var(--red)}
  .csbtn.free{border-color:var(--teal);color:var(--teal)}
  .acts{display:flex;gap:9px}
  .btn{flex:1;padding:15px;border-radius:14px;border:0;font:800 13.5px 'Manrope';cursor:pointer;
    text-align:center;text-decoration:none;display:block}
  .btn.go{background:var(--blue);color:#fff}
  .btn.gh{background:var(--bg);color:var(--ink);flex:0 0 auto;padding:15px 18px}
  .btn.del{background:var(--bg);color:var(--red);flex:0 0 auto;padding:15px 17px}

  .fld{margin-bottom:11px}
  .fld label{font:700 11px 'Manrope';color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
  .fld input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;
    font:600 14px 'Manrope';color:var(--ink);outline:none;background:var(--card)}
  .fld input:focus{border-color:var(--blue)}
  .two{display:flex;gap:9px}
  .two .fld{flex:1}
  .mh{font:600 15px 'Unbounded';margin:6px 0 14px}

  /* режим выбора точки */
  .picking #sheet,.picking .chips{opacity:0;pointer-events:none;transition:.2s}
  .pickbar{position:fixed;left:12px;right:12px;bottom:calc(20px + var(--bot));z-index:90;display:none;
    background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--sh);
    align-items:center;gap:12px}
  .picking .pickbar{display:flex}
  .pickbar b{font:700 13px 'Manrope';flex:1}
  .pickbar button{background:rgba(255,255,255,.16);border:0;color:#fff;font:800 12px 'Manrope';
    padding:9px 14px;border-radius:10px;cursor:pointer}
  .crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:85;display:none;
    font-size:34px;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
  .picking .crosshair{display:block}

  /* метки */
  .pm{width:44px;height:44px;border-radius:50%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;font-weight:800;box-shadow:0 3px 11px rgba(22,35,43,.4);
    border:3px solid #fff;line-height:1;cursor:pointer}
  .pm .n{font-size:15px}
  .pm .l{font-size:6.5px;font-weight:700;text-transform:uppercase;opacity:.9}
  .me{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;
    box-shadow:0 0 0 7px rgba(17,86,214,.22),0 2px 8px rgba(0,0,0,.3)}

  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);z-index:300;
    bottom:calc(var(--peek,96px) + 70px);background:var(--ink);color:#fff;font:700 12.5px 'Manrope';
    padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;
    max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #warn{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);text-align:center}
  #warn .b{max-width:400px;background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--sh)}
  #warn h3{font:600 15px 'Unbounded';margin-bottom:10px}
  #warn p{font:600 13px 'Manrope';color:var(--muted);line-height:1.65}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <div class="bar">
    <div class="logo">P</div>
    <input id="q" placeholder="Chorsu, Magic City…">
  </div>
  <button class="lang" id="lang">UZ</button>
</div>

<div class="chips" id="chips"></div>

<div class="fabs">
  <button class="fab" id="addbtn" title="add">➕</button>
  <button class="fab" id="trafbtn" title="traffic">🚦</button>
  <button class="fab" id="locbtn" title="geo">📍</button>
</div>

<div class="crosshair">📍</div>
<div class="pickbar">
  <b id="picktxt"></b>
  <button id="pickcancel"></button>
  <button id="pickok" style="background:var(--teal)"></button>
</div>

<div id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="shead" id="shead"><h2 id="stitle"></h2><span id="count"></span></div>
  <div id="list"></div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="warn"><div class="b"><h3 id="warnt"></h3><p id="warnp"></p></div></div>

<script>
/* ═════════ КЛЮЧ ЯНДЕКС КАРТ ═════════ */
const YANDEX_API_KEY = 'be1856ef-50e1-40ed-abb7-80a23f99ddb3';

/* ═════════ ЯЗЫКИ ═════════ */
const T = {
 ru:{
  ph:'Чорсу, Magic City…', near:'Парковки рядом', of:'из',
  all:'Все', free:'Есть места', cheap:'До 5 000 сум', free0:'Бесплатные', mine:'Мои',
  spots:'мест', freeP:'Бесплатно', sum:'сум/ч', mode:'режим', avail:'свободно',
  help:'Помогите другим водителям — отметьте:', took:'🚗 Занял место', gave:'✅ Освободил',
  route:'Маршрут в Яндекс →', thanksT:'Спасибо! Место отмечено занятым',
  thanksF:'Спасибо! Место освободилось', nores:'Ничего не найдено.<br>Измените фильтр или запрос.',
  geoing:'Определяю местоположение…', geoOk:'Вы здесь · точность',
  geoDeny:'Доступ к геолокации запрещён. Разрешите его в настройках браузера.',
  geoUnav:'Местоположение недоступно. Включите GPS.',
  geoTime:'Не удалось определить за 15 сек. Попробуйте на улице.',
  geoNo:'Геолокация не поддерживается',
  geoHttp:'Геолокация работает только на HTTPS-сайте',
  geoRetry:'GPS не отвечает, пробую по сети…',
  geoRough:'Примерное местоположение (по сети). Для точного включите GPS',
  geoBlocked:'Сайту запрещён доступ. Нажмите на 🔒 в адресной строке → Разрешения → Геоданные → Разрешить',
  geoManual:'Точка установлена вручную',
  live:'Слежение включено', liveOff:'Слежение выключено',
  trafOn:'Пробки включены', trafOff:'Пробки выключены',
  pick:'Двигайте карту — метка укажет место', cancel:'Отмена', ok:'Готово',
  addT:'Новая парковка', nm:'Название', pr:'Цена, сум/час (0 — бесплатно)',
  tt:'Всего мест', ff:'Свободно сейчас', hh:'Режим работы', save:'Сохранить парковку',
  added:'Парковка добавлена!', needName:'Введите название', del:'Удалить',
  delOk:'Парковка удалена', warnT:'Карта не загрузилась',
  warnP:'Проверьте интернет или ограничения домена в кабинете Яндекс API.'
 },
 uz:{
  ph:'Chorsu, Magic City…', near:'Yaqindagi parkovkalar', of:'/',
  all:'Barchasi', free:'Joy bor', cheap:'5 000 so‘mgacha', free0:'Bepul', mine:'Meniki',
  spots:'joy', freeP:'Bepul', sum:'so‘m/soat', mode:'ish vaqti', avail:'bo‘sh',
  help:'Boshqa haydovchilarga yordam bering:', took:'🚗 Joy egalladim', gave:'✅ Bo‘shatdim',
  route:'Yandex’da yo‘nalish →', thanksT:'Rahmat! Joy band deb belgilandi',
  thanksF:'Rahmat! Joy bo‘shadi', nores:'Hech narsa topilmadi.<br>Filtrni o‘zgartiring.',
  geoing:'Joylashuv aniqlanmoqda…', geoOk:'Siz shu yerdasiz · aniqlik',
  geoDeny:'Joylashuvga ruxsat berilmagan. Brauzer sozlamalaridan yoqing.',
  geoUnav:'Joylashuv mavjud emas. GPS’ni yoqing.',
  geoTime:'15 soniyada aniqlanmadi. Ko‘chada urinib ko‘ring.',
  geoNo:'Geolokatsiya qo‘llab-quvvatlanmaydi',
  geoHttp:'Geolokatsiya faqat HTTPS saytda ishlaydi',
  geoRetry:'GPS javob bermayapti, tarmoq orqali urinyapman…',
  geoRough:'Taxminiy joylashuv (tarmoq bo‘yicha). Aniq bo‘lishi uchun GPS’ni yoqing',
  geoBlocked:'Saytga ruxsat berilmagan. Manzil satridagi 🔒 → Ruxsatlar → Joylashuv → Ruxsat berish',
  geoManual:'Nuqta qo‘lda belgilandi',
  live:'Kuzatuv yoqildi', liveOff:'Kuzatuv o‘chirildi',
  trafOn:'Tirbandlik yoqildi', trafOff:'Tirbandlik o‘chirildi',
  pick:'Xaritani suring — belgi joyni ko‘rsatadi', cancel:'Bekor', ok:'Tayyor',
  addT:'Yangi parkovka', nm:'Nomi', pr:'Narx, so‘m/soat (0 — bepul)',
  tt:'Jami joylar', ff:'Hozir bo‘sh', hh:'Ish vaqti', save:'Saqlash',
  added:'Parkovka qo‘shildi!', needName:'Nomini kiriting', del:'O‘chirish',
  delOk:'Parkovka o‘chirildi', warnT:'Xarita yuklanmadi',
  warnP:'Internetni yoki Yandex API domen cheklovlarini tekshiring.'
 }
};
let lang = localStorage.getItem('pt-lang') || 'ru';
const t = k => T[lang][k];

/* ═════════ ПАРКОВКИ ═════════ */
const BASE=[
 {id:'chorsu', name:'Чорсу / Chorsu',        addr:'Eski shahar, Navoiy ko‘chasi', lat:41.3266,lng:69.2345,total:150,free:34, price:3000, hours:'06:00–20:00'},
 {id:'magic',  name:'Magic City Park',        addr:'Bobur ko‘chasi, 174',          lat:41.2846,lng:69.2274,total:400,free:120,price:5000, hours:'24/7'},
 {id:'mega',   name:'Mega Planet',            addr:'Kichik Halqa Yo‘li',           lat:41.3452,lng:69.2860,total:300,free:85, price:0,    hours:'10:00–22:00'},
 {id:'samdar', name:'Samarqand Darvoza',      addr:'Qoratosh ko‘chasi, 5A',        lat:41.3163,lng:69.2312,total:250,free:12, price:0,    hours:'10:00–23:00'},
 {id:'timur',  name:'Amir Temur xiyoboni',    addr:'Amir Temur shoh ko‘chasi',     lat:41.3111,lng:69.2797,total:80, free:0,  price:5000, hours:'24/7'},
 {id:'tcity',  name:'Tashkent City Park',     addr:'Islom Karimov ko‘chasi',       lat:41.3138,lng:69.2481,total:500,free:210,price:6000, hours:'24/7'},
 {id:'next',   name:'NEXT',                   addr:'Bobur ko‘chasi, 2',            lat:41.2953,lng:69.2670,total:350,free:44, price:0,    hours:'10:00–23:00'},
 {id:'alay',   name:'Oloy bozori',            addr:'Amir Temur, 42',               lat:41.3208,lng:69.2853,total:100,free:6,  price:3000, hours:'06:00–20:00'},
 {id:'rail',   name:'Toshkent vokzali',       addr:'Vokzal maydoni',               lat:41.2907,lng:69.2874,total:200,free:57, price:4000, hours:'24/7'},
 {id:'compass',name:'Compass',                addr:'Farg‘ona Yo‘li',               lat:41.2822,lng:69.3140,total:280,free:130,price:0,    hours:'10:00–22:00'},
 {id:'minor',  name:'Minor masjidi',          addr:'Kichik Halqa Yo‘li',           lat:41.3347,lng:69.2683,total:60, free:18, price:0,    hours:'05:00–22:00'},
 {id:'airport',name:'Aeroport T2',            addr:'Hamid Olimjon, 41',            lat:41.2612,lng:69.2823,total:450,free:190,price:10000,hours:'24/7'},
];
let spots=[], filter='all', query='', mePos=null, meAcc=0;
let ymap=null, pmarks={}, meMark=null, meCircle=null, traffic=null;
let watchId=null, picking=false;

/* ═════════ ХРАНИЛИЩЕ (работает и на сайте, и в Claude) ═════════ */
const store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k,true); return r&&r.value?r.value:null} }catch(e){}
    try{ return localStorage.getItem(k) }catch(e){ return null }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v,true); } }catch(e){}
    try{ localStorage.setItem(k,v) }catch(e){}
  }
};
async function loadData(){
  spots=JSON.parse(JSON.stringify(BASE));
  const f=await store.get('pt-free');
  if(f){ try{const m=JSON.parse(f); spots.forEach(s=>{if(m[s.id]!=null)s.free=m[s.id]})}catch(e){} }
  const u=await store.get('pt-user');
  if(u){ try{ spots=spots.concat(JSON.parse(u)) }catch(e){} }
}
async function saveFree(){
  const m={}; spots.filter(s=>!s.user).forEach(s=>m[s.id]=s.free);
  await store.set('pt-free',JSON.stringify(m));
  await store.set('pt-user',JSON.stringify(spots.filter(s=>s.user)));
}

/* ═════════ КАРТА ═════════ */
function loadYandex(){
  const sc=document.createElement('script');
  sc.src='https://api-maps.yandex.ru/2.1/?lang='+(lang==='uz'?'ru_RU':'ru_RU')+'&apikey='+YANDEX_API_KEY;
  sc.onload=()=>ymaps.ready(initMap);
  sc.onerror=showWarn;
  document.head.appendChild(sc);
  setTimeout(()=>{ if(!ymap) showWarn() },9000);
}
function showWarn(){
  document.getElementById('warnt').textContent=t('warnT');
  document.getElementById('warnp').textContent=t('warnP');
  document.getElementById('warn').style.display='flex';
}
function initMap(){
  ymap=new ymaps.Map('map',{center:[41.3111,69.2650],zoom:13,controls:[]},
    {suppressMapOpenBlock:true,yandexMapDisablePoiInteractivity:true});
  document.getElementById('warn').style.display='none';
  draw();
  enableManualPin();
}
const colorOf=s=> s.free===0?'#D64541' : (s.free/s.total<.15?'#F4A300':'#17A398');

function draw(){
  if(!ymap)return;
  Object.values(pmarks).forEach(p=>ymap.geoObjects.remove(p)); pmarks={};
  visible().forEach(s=>{
    const L=ymaps.templateLayoutFactory.createClass(
      `<div class="pm" style="background:${colorOf(s)}"><span class="n">${s.free}</span><span class="l">${t('spots')}</span></div>`);
    const pm=new ymaps.Placemark([s.lat,s.lng],{},{
      iconLayout:L, iconShape:{type:'Circle',coordinates:[0,0],radius:22}, iconOffset:[-22,-22]});
    pm.events.add('click',()=>openCard(s.id));
    ymap.geoObjects.add(pm); pmarks[s.id]=pm;
  });
  if(meCircle) ymap.geoObjects.add(meCircle);
  if(meMark) ymap.geoObjects.add(meMark);
}

/* ═════════ СПИСОК ═════════ */
function dist(a,b,c,d){
  const R=6371,dl=(c-a)*Math.PI/180,dg=(d-b)*Math.PI/180;
  const h=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function visible(){
  let v=spots.filter(s=>(s.name+s.addr).toLowerCase().includes(query));
  if(filter==='free')v=v.filter(s=>s.free>0);
  if(filter==='cheap')v=v.filter(s=>s.price>0&&s.price<=5000);
  if(filter==='free0')v=v.filter(s=>s.price===0);
  if(filter==='mine')v=v.filter(s=>s.user);
  if(mePos)v.sort((a,b)=>dist(mePos.lat,mePos.lng,a.lat,a.lng)-dist(mePos.lat,mePos.lng,b.lat,b.lng));
  else v.sort((a,b)=>b.free-a.free);
  return v;
}
const fmtP=p=>p===0?t('freeP'):p.toLocaleString('ru')+' '+t('sum');
function render(){
  const v=visible();
  document.getElementById('count').textContent=v.length+' '+t('of')+' '+spots.length;
  document.getElementById('list').innerHTML = v.length ? v.map(s=>`
    <div class="row" onclick="openCard('${s.id}')">
      <div class="dot" style="background:${colorOf(s)}"><b>${s.free}</b><small>${t('spots')}</small></div>
      <div class="rt"><b>${s.user?'⭐ ':''}${s.name}</b><span>${fmtP(s.price)} · ${s.hours}</span></div>
      ${mePos?`<div class="rd">${dist(mePos.lat,mePos.lng,s.lat,s.lng).toFixed(1)} km</div>`:''}
    </div>`).join('') : `<div class="empty">${t('nores')}</div>`;
  draw();
}

/* ═════════ КАРТОЧКА ═════════ */

      <div class="stat"><b>${s.free}/${s.total}</b><span>${t('avail')} ${pct}%</span></div>
      <div class="stat"><b style="font-size:11.5px">${s.hours}</b><span>${t('mode')}</span></div>

window.closeMask=()=>document.getElementById('mask').classList.remove('open');
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')closeMask()};

window.mark=function(id,d){
  const s=spots.find(x=>x.id===id);
  s.free=Math.max(0,Math.min(s.total,s.free+d));

  toast(d<0?t('thanksT'):t('thanksF'));

window.delSpot=function(id){
  spots=spots.filter(s=>s.id!==id);

};

function toast(x){
  const el=document.getElementById('toast');
  el.innerHTML=x; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ═════════ ГЕОЛОКАЦИЯ (реальная) ═════════ */
function putMe(lat,lng,acc){
  mePos={lat,lng}; meAcc=acc;
  if(!ymap)return;
  if(meMark)ymap.geoObjects.remove(meMark);
  if(meCircle)ymap.geoObjects.remove(meCircle);
  meCircle=new ymaps.Circle([[lat,lng],Math.max(acc,20)],{},{
    fillColor:'#1156D622',strokeColor:'#1156D655',strokeWidth:1,interactivityModel:'default#transparent'});
  const L=ymaps.templateLayoutFactory.createClass('<div class="me"></div>');
  meMark=new ymaps.Placemark([lat,lng],{},{iconLayout:L,iconOffset:[-9,-9],zIndex:900});
  ymap.geoObjects.add(meCircle); ymap.geoObjects.add(meMark);
}
const getPos=o=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,o));

async function permState(){
  try{
    if(navigator.permissions){
      const p=await navigator.permissions.query({name:'geolocation'});
      return p.state;                       // granted | prompt | denied
    }
  }catch(e){}
  return 'unknown';
}

// запасной вариант: Яндекс определяет город по IP/сети (неточно, но лучше чем ничего)
function yandexGeo(){
  return new Promise((res,rej)=>{
    if(!window.ymaps||!ymaps.geolocation)return rej();
    ymaps.geolocation.get({provider:'auto',autoReverseGeocode:false})
      .then(r=>{
        const c=r.geoObjects.get(0).geometry.getCoordinates();
        res({lat:c[0],lng:c[1],acc:3000});
      },rej);
  });
}

function applyPos(lat,lng,acc,zoom){
  putMe(lat,lng,acc);
  if(ymap)ymap.setCenter([lat,lng],zoom,{duration:500});
  render();
}

document.getElementById('locbtn').onclick=async function(){
  const b=this;
  if(watchId!=null){                       // второй тап — выключить слежение
    navigator.geolocation.clearWatch(watchId); watchId=null;
    b.classList.remove('live'); toast(t('liveOff')); return;
  }
  if(!navigator.geolocation){toast(t('geoNo'));return}
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){toast(t('geoHttp'));return}

  const st=await permState();
  if(st==='denied'){ toast(t('geoBlocked')); return; }

  toast(t('geoing'));
  let p=null, lastErr=null;

  // 1) точный GPS
  try{ p=await getPos({enableHighAccuracy:true,timeout:12000,maximumAge:0}); }
  catch(e){ lastErr=e; }

  // 2) если не вышло — по сети/вышкам, дольше и мягче
  if(!p && lastErr && lastErr.code!==1){
    toast(t('geoRetry'));
    try{ p=await getPos({enableHighAccuracy:false,timeout:20000,maximumAge:120000}); }
    catch(e){ lastErr=e; }
  }

  if(p){
    applyPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy,16);
    toast(t('geoOk')+' ±'+Math.round(p.coords.accuracy)+' m');
    watchId=navigator.geolocation.watchPosition(
      q=>{putMe(q.coords.latitude,q.coords.longitude,q.coords.accuracy);render()},
      ()=>{}, {enableHighAccuracy:true,timeout:20000,maximumAge:5000});
    b.classList.add('live');
    return;
  }

  // 3) отказ доступа — подсказка, как включить
  if(lastErr && lastErr.code===1){ toast(t('geoDeny')); return; }

  // 4) последняя попытка — через Яндекс (приблизительно)
  try{
    const y=await yandexGeo();
    applyPos(y.lat,y.lng,y.acc,13);
    toast(t('geoRough'));
  }catch(e){
    toast((lastErr&&lastErr.code===2?t('geoUnav'):t('geoTime'))+
      (lastErr?' <span style="opacity:.6">[code '+lastErr.code+']</span>':''));
  }
};

// запасной способ: долгое нажатие на карту — поставить себя вручную
function enableManualPin(){
  if(!ymap)return;
  ymap.events.add('contextmenu',e=>{
    const c=e.get('coords');
    applyPos(c[0],c[1],30,ymap.getZoom());
    toast(t('geoManual'));
  });
}

window.saveNew=function(lat,lng){
  const n=document.getElementById('f_n').value.trim();
  if(!n){toast(t('needName'));return}
  const total=Math.max(1,+document.getElementById('f_t').value||1);
  spots.push({
    id:'u'+Date.now(), user:true, name:n,
    addr:lat.toFixed(4)+', '+lng.toFixed(4), lat, lng, total,
    free:Math.min(total,Math.max(0,+document.getElementById('f_f').value||0)),
    price:Math.max(0,+document.getElementById('f_p').value||0),
    hours:document.getElementById('f_h').value||'24/7'
  });
  saveFree(); closeMask(); render(); toast(t('added'));
};

/* ═════════ ШТОРКА (с перетаскиванием) ═════════ */
const SNAP=[96,300,window.innerHeight*0.78];
let snapIdx=0;
function setSnap(i){
  snapIdx=Math.max(0,Math.min(2,i));
  const h=SNAP[snapIdx];
  document.getElementById('sheet').style.height=h+'px';
  document.documentElement.style.setProperty('--peek',h+'px');
  setTimeout(()=>{if(ymap)ymap.container.fitToViewport()},300);
}
document.getElementById('shead').onclick=()=>setSnap(snapIdx===2?0:snapIdx+1);
(function(){
  const g=document.getElementById('grab'); let y0=0,h0=0,drag=false;
  const start=e=>{drag=true;y0=(e.touches?e.touches[0]:e).clientY;h0=document.getElementById('sheet').offsetHeight;
    document.getElementById('sheet').style.transition='none'};
  const move=e=>{if(!drag)return;e.preventDefault();
    const y=(e.touches?e.touches[0]:e).clientY;
    const h=Math.max(96,Math.min(window.innerHeight*0.85,h0+(y0-y)));
    document.getElementById('sheet').style.height=h+'px';
    document.documentElement.style.setProperty('--peek',h+'px')};
  const end=()=>{if(!drag)return;drag=false;
    document.getElementById('sheet').style.transition='';
    const h=document.getElementById('sheet').offsetHeight;
    let best=0,bd=1e9; SNAP.forEach((s,i)=>{if(Math.abs(s-h)<bd){bd=Math.abs(s-h);best=i}});
    setSnap(best)};
  g.addEventListener('touchstart',start,{passive:true});
  g.addEventListener('touchmove',move,{passive:false});
  g.addEventListener('touchend',end);
  g.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
})();

  document.getElementById('chips').innerHTML=fs.map(([k,l])=>

    filter=c.dataset.f; buildUI(); render();
  });
}
document.getElementById('lang').onclick=()=>{
  lang=lang==='ru'?'uz':'ru'; localStorage.setItem('pt-lang',lang);
  buildUI(); render(); closeMask();
};

setSnap(0); buildUI();

window.addEventListener('resize',()=>{SNAP[2]=window.innerHeight*0.78});
