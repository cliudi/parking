async function prepareSubmissionImage(file){
  if(file.size>5*1024*1024)throw new Error('Фотография больше 5 МБ');
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Поддерживаются JPEG, PNG и WebP');
  const bitmap=await createImageBitmap(file);
  const scale=Math.min(1,1920/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  bitmap.close();
  return await new Promise((resolve,reject)=>canvas.toBlob(
    blob=>blob?resolve(blob):reject(new Error('Не удалось обработать фотографию')),
    'image/jpeg',0.82
  ));
}
async function uploadSubmissionPhotos(files){
  if(!files.length)return [];
  const token=await accessToken();
  if(!token)throw new Error('Войдите в аккаунт, чтобы добавить фотографии');
  if(files.length>5)throw new Error('Можно добавить не более 5 фотографий');
  const urls=[];
  for(const file of files){
    const blob=await prepareSubmissionImage(file);
    const path='submissions/'+authSession.user.id+'/'+crypto.randomUUID()+'.jpg';
    const res=await fetch(SUPABASE_URL+'/storage/v1/object/parking-photos/'+path,{
      method:'POST',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'image/jpeg','x-upsert':'false'},
      body:blob
    });
    if(!res.ok)throw new Error('Не удалось загрузить фотографию');
    urls.push(SUPABASE_URL+'/storage/v1/object/public/parking-photos/'+path);
  }
  return urls;
}

    items.push({kind:'submission',id:String(s.id),status:s.status,title,text:(cleanText(s.name)||'Парковка')+' — '+label,note:cleanText(s.admin_note),created_at:s.created_at});

    if((!r.status||r.status==='PENDING')&&!r.admin_note)return;

async function submitAuth(mode){
  const email=cleanText(document.getElementById('auth_email').value).toLowerCase();
  const password=document.getElementById('auth_password').value;
  const guestFavorites=favorites.slice();
  const message=document.getElementById('auth_message');
  if(!email||password.length<6){message.textContent='Введите почту и пароль не короче 6 символов';return}
  document.getElementById('authLoginBtn').disabled=true;
  document.getElementById('authSignupBtn').disabled=true;
  message.textContent='Подождите…';
  try{
    const data=await authAction(mode,email,password);
    if(!data.access_token){
      message.style.color='var(--green)';
      message.textContent='Проверьте почту и подтвердите регистрацию, затем войдите.';
      return;
    }
    favorites=loadFav();
    await loadRemoteFavorites();
    const missing=guestFavorites.filter(id=>!favorites.includes(id));
    for(const id of missing){
      favorites.push(id);
      await syncFavorite(id,true);
    }
    saveFav();
    await Promise.all([loadMySubmissions(),loadMyReports()]);
    closeSheet();renderProfile();updateNotificationBadge();toast(mode==='signup'?'Аккаунт создан':'Вы вошли в аккаунт');
  }catch(e){
    message.style.color='var(--red)';
    message.textContent=e.message.includes('Invalid login')?'Неверная почта или пароль':e.message;
  }finally{
    const login=document.getElementById('authLoginBtn'),signup=document.getElementById('authSignupBtn');
    if(login)login.disabled=false;if(signup)signup.disabled=false;
  }
}

async function geocodeAddressHttp(query){
  const params=new URLSearchParams({
    apikey:YANDEX_GEOCODER_API_KEY,geocode:query,format:'json',lang:'ru_RU',results:'1'
  });
  const response=await fetch(`https://geocode-maps.yandex.ru/v1/?${params.toString()}`,{
    headers:{Accept:'application/json'},referrerPolicy:'strict-origin-when-cross-origin'
  });
  if(!response.ok)throw new Error(`GEOCODER_HTTP_${response.status}`);
  const payload=await response.json();
  const object=payload?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
  if(!object)return null;
  const position=String(object?.Point?.pos||'').trim().split(/\s+/).map(Number);
  if(position.length!==2||!position.every(Number.isFinite))return null;
  const meta=object?.metaDataProperty?.GeocoderMetaData||{};
  return {coords:[position[1],position[0]],label:object?.name||meta?.text||query,description:object?.description||meta?.Address?.formatted||meta?.text||'',fullText:meta?.text||'',kind:meta?.kind||''};
}

document.getElementById('search').addEventListener('change',async e=>{

});

  }
}
let isDark = (()=>{ try{return localStorage.getItem('pl-theme')==='dark'}catch(e){return false} })();
applyTheme(isDark);
document.getElementById('themebtn').onclick=()=>{isDark=!isDark;applyTheme(isDark)};

loadYandex();buildQchips();buildNav();loadParkingsFromDB();updateNotificationBadge();
if(authSession){
  loadRemoteFavorites();
  Promise.all([loadMySubmissions(),loadMyReports()]).then(()=>{renderProfile();updateNotificationBadge()});
}
/* АВТООПРЕДЕЛЕНИЕ ПРИ ЗАПУСКЕ (как в Яндекс.Картах).
   Кэш показываем сразу, а системный запрос разрешения откладываем,
   пока окно приложения не окажется реально на экране — иначе Android
   иногда "теряет" диалог, если его показать во время сплэша/анимации запуска. */
(function bootLocate(){
  // 1) мгновенно: наш сохранённый кэш (0 мс) — точка есть до загрузки карты
  const cached=loadLastPos();
  if(cached)putMe(cached.lat,cached.lng,cached.acc);

  async function tryGrantOnce(){
    const Geo=GeoPlugin();
    try{
      if(Geo){
        const p=await Geo.checkPermissions();
        if(p.location==='granted'||p.coarseLocation==='granted')return true;
        const r=await Geo.requestPermissions();
        return (r.location==='granted'||r.coarseLocation==='granted');
      }
      return (await permState())!=='denied';
    }catch(e){return false}
  }

  async function afterGrant(){
    gpsGot=false;
    startPreciseWatch();
    instantFix().then(i=>{if(!gpsGot)applyFix(i.lat,i.lng,i.acc,null,false)}).catch(()=>{});
    fastFix().then(f=>{if(!gpsGot)applyFix(f.lat,f.lng,f.acc,null,false)}).catch(()=>{});
    // пока спутники не пойманы — раз в 5 сек пробуем сеть заново (данные Wi-Fi/вышек
    // могут уточниться по мере сканирования), но не дольше минуты
    for(let i=0;i<12&&!gpsGot;i++){
      await new Promise(r=>setTimeout(r,5000));
      if(gpsGot)break;
      try{const f=await fastFix();applyFix(f.lat,f.lng,f.acc,null,false)}catch(e){}
    }
  }

  async function run(){
    let granted=await tryGrantOnce();
    if(!granted){
      // окно приложения могло быть ещё не в фокусе — пробуем ещё раз чуть позже
      await new Promise(r=>setTimeout(r,1200));
      granted=await tryGrantOnce();
    }
    if(granted)afterGrant();
    // если так и не дали доступ — молча остаёмся на Ташкенте, кнопка ◎ остаётся рабочей
  }

  // ждём, пока окно реально прогрузится (не просто DOM, а весь load),
  // плюс небольшая пауза — Android должен успеть показать нативное окно поверх сплэша
  const start=()=>setTimeout(run,900);
  if(document.readyState==='complete')start();
  else window.addEventListener('load',start);
})();
</script>
