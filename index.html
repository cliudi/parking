<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://api-maps.yandex.ru" crossorigin>
<link rel="preconnect" href="https://core-renderer-tiles.maps.yandex.net" crossorigin>
<link rel="dns-prefetch" href="https://api-maps.yandex.ru">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parkly">
<meta name="mobile-web-app-capable" content="yes">
<title>Parkly — парковки Ташкента</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12202E; --ink2:#5A6B7A; --bg:#F4F6F8; --card:#FFF; --line:#E6EBEF;
    --blue:#2563EB; --blue-d:#1D4ED8; --green:#22A24C; --green2:#1FA84C;
    --amber:#F5A623; --red:#E5484D; --violet:#7A5CFF; --grey:#9AA7B2;
    --sh-s:0 2px 8px rgba(18,32,46,.08); --sh:0 6px 20px rgba(18,32,46,.12); --sh-l:0 -6px 24px rgba(18,32,46,.10);
    --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
    --nav:60px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Manrope',sans-serif;color:var(--ink);background:var(--bg)}
  button{font-family:inherit}
  .hidden{display:none!important}

  /* ─────────── КАРТА (экран) ─────────── */
  #screen-map{position:fixed;inset:0}
  #map{position:absolute;inset:0;z-index:1;background:#E8EDF0}

  .topwrap{position:fixed;top:calc(10px + var(--top));left:12px;right:12px;z-index:60}
  .searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;box-shadow:var(--sh)}
  .searchbar .si{color:var(--ink2);font-size:17px}
  .searchbar input{flex:1;border:0;outline:none;background:none;font:600 14.5px 'Manrope';color:var(--ink);min-width:0}
  .searchbar input::placeholder{color:var(--ink2)}
  .bell{width:26px;height:26px;border-radius:50%;background:var(--bg);border:0;position:relative;font-size:14px;cursor:pointer;flex-shrink:0}
  .bell .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid var(--card)}

  .qchips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:1px}
  .qchips::-webkit-scrollbar{display:none}
  .qchip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;
    background:var(--card);border:0;font:700 13px 'Manrope';color:var(--ink);box-shadow:var(--sh-s);cursor:pointer;white-space:nowrap}
  .qchip.on{background:var(--blue);color:#fff}
  .qchip.on .qi{filter:brightness(3)}

  .sidefabs{position:absolute;right:12px;z-index:55;display:flex;flex-direction:column;gap:10px;
    top:50%;transform:translateY(-60%)}
  .sfab{width:46px;height:46px;border-radius:13px;background:var(--card);border:0;box-shadow:var(--sh);
    font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .sfab:active{transform:scale(.93)}
  .sfab.on{background:var(--blue);color:#fff}
  .sfab.live{background:var(--green2);color:#fff}
  .accbadge{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:5px 8px;
    font:800 10px 'Manrope';color:var(--ink2);text-align:center;display:none;white-space:nowrap}
  .accbadge.on{display:block}
  .accbadge.good{color:var(--green2)}
  .accbadge.bad{color:var(--amber)}
  .zoomcol{display:flex;flex-direction:column;background:var(--card);border-radius:13px;box-shadow:var(--sh);overflow:hidden}
  .zoomcol button{width:46px;height:44px;border:0;background:var(--card);font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
  .zoomcol button:first-child{border-bottom:1px solid var(--line)}

  .legendbtn{position:absolute;left:12px;z-index:55;top:50%;transform:translateY(120%);
    width:42px;height:42px;border-radius:12px;background:var(--card);border:0;box-shadow:var(--sh);
    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  /* нижняя мини-карточка */
  #minicard{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--bot));z-index:58;
    background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px 16px;display:none}
  #minicard.on{display:block;animation:slideUp .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .mc-head{display:flex;align-items:flex-start;gap:12px}
  .mc-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
  .mc-body{flex:1;min-width:0}
  .mc-body h3{font:700 15px 'Manrope';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-sub{font:600 12.5px 'Manrope';color:var(--ink2);margin-top:2px}
  .mc-meta{display:flex;align-items:center;gap:5px;font:700 12px 'Manrope';margin-top:5px}
  .mc-dist{font:800 13px 'Manrope';color:var(--blue);white-space:nowrap;display:flex;align-items:center;gap:3px}
  .mc-btn{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--blue);color:#fff;border:0;font:800 14px 'Manrope';cursor:pointer}
  .mc-btn:active{background:var(--blue-d)}

  /* ─────────── НИЖНЯЯ НАВИГАЦИЯ ─────────── */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:65;height:calc(var(--nav) + var(--bot));
    padding-bottom:var(--bot);background:var(--card);border-top:1px solid var(--line);
    display:flex;align-items:stretch}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:none;cursor:pointer;color:var(--ink2);position:relative}
  .navitem .ni{font-size:19px;line-height:1}
  .navitem span{font:700 10px 'Manrope'}
  .navitem.on{color:var(--blue)}
  .navadd{transform:translateY(-2px)}
  .navadd .ni{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(37,99,235,.4)}
  .navadd span{color:var(--blue)}

  /* ─────────── ЛИСТЫ (Избранное, Профиль, полная карточка) ─────────── */
  .screen{position:fixed;inset:0;bottom:calc(var(--nav) + var(--bot));z-index:40;background:var(--bg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-top:var(--top)}
  .screen.on{display:block}
  .scr-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;z-index:2}
  .scr-head h1{font:800 19px 'Manrope'}
  .scr-head .act{font:700 14px 'Manrope';color:var(--blue);border:0;background:none;cursor:pointer}

  /* ─────────── МОДАЛКИ (bottom sheet) ─────────── */
  .mask{position:fixed;inset:0;background:rgba(18,32,46,.5);z-index:200;display:none;align-items:flex-end}
  .mask.open{display:flex}
  .sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;
    animation:up .28s cubic-bezier(.2,.8,.3,1);padding-bottom:calc(20px + var(--bot))}
  @keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .grabber{padding:10px 0 4px;display:flex;justify-content:center;position:sticky;top:0}
  .grabber i{width:42px;height:5px;border-radius:3px;background:var(--line)}

  /* полная карточка */
  .fc-photo{position:relative;height:210px;background:#DCE3E8 center/cover;margin:-4px -0 0}
  .fc-photo .navbtns{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
  .fc-photo .rbtns{display:flex;gap:8px}
  .cbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);border:0;font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-s)}
  .cbtn.fav.on{color:var(--red)}
  .fc-body{padding:16px 18px 0}
  .fc-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .fc-title h2{font:800 20px 'Manrope';line-height:1.2}
  .rating{display:flex;align-items:center;gap:3px;background:#E9F7EE;color:var(--green2);
    padding:4px 8px;border-radius:8px;font:800 12px 'Manrope';flex-shrink:0}
  .fc-addr{display:flex;align-items:center;gap:6px;font:600 13px 'Manrope';color:var(--ink2);margin-top:8px}
  .fc-status{display:flex;align-items:center;gap:6px;font:700 13px 'Manrope';margin-top:6px}
  .fc-status .dist{color:var(--blue);margin-left:auto}
  .fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .fc-cell{background:var(--bg);border-radius:14px;padding:13px 14px}
  .fc-cell .lbl{font:700 10.5px 'Manrope';color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
  .fc-cell .val{font:800 16px 'Manrope';margin-top:4px}
  .fc-cell .val.sm{font-size:13.5px}
  .fc-cell .val.free{color:var(--green2)}
  .fc-cell .val.ev{color:var(--violet)}
  .legalnote{background:#FEF6E7;border:1px solid #F6E2B8;border-radius:12px;padding:11px 13px;
    font:600 12px 'Manrope';color:#8A6D1F;line-height:1.5;margin-bottom:14px;display:flex;gap:8px}
  .verify{font:600 12px 'Manrope';color:var(--ink2);margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .fc-actions{display:flex;flex-direction:column;gap:9px}
  .btn-primary{width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;border:0;
    font:800 15px 'Manrope';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary:active{background:var(--blue-d)}
  .btn-outline{width:100%;padding:14px;border-radius:14px;background:var(--card);color:var(--blue);
    border:1.5px solid var(--line);font:800 14px 'Manrope';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-report{width:100%;padding:12px;border-radius:12px;background:none;color:var(--ink2);border:0;
    font:700 13px 'Manrope';cursor:pointer;margin-top:2px}

  /* фильтры */
  .filt-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px}
  .filt-head h2{font:800 18px 'Manrope'}
  .filt-head .x{width:32px;height:32px;border-radius:50%;background:var(--bg);border:0;font-size:15px;cursor:pointer}
  .filt-body{padding:0 18px}
  .filt-group{margin-bottom:20px}
  .filt-group h3{font:700 13px 'Manrope';color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
  .radio-row,.check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .radio-row:last-child,.check-row:last-child{border:0}
  .radio-row .ri{width:26px;text-align:center;font-size:16px}
  .radio-row .rl{flex:1;font:700 14.5px 'Manrope'}
  .radio-mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
  .radio-row.sel .radio-mark{border-color:var(--blue)}
  .radio-row.sel .radio-mark::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
  .toggle{width:44px;height:26px;border-radius:13px;background:var(--line);flex-shrink:0;position:relative;transition:.2s;cursor:pointer}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--sh-s)}
  .toggle.on{background:var(--blue)}
  .toggle.on::after{left:21px}
  .price-row{display:flex;justify-content:space-between;font:700 13px 'Manrope';color:var(--ink2);margin-bottom:8px}
  .slider{width:100%}
  .filt-foot{padding:14px 18px calc(14px + var(--bot));display:flex;flex-direction:column;gap:9px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
  .btn-ghost{width:100%;padding:13px;border-radius:12px;background:none;color:var(--ink2);border:0;font:700 14px 'Manrope';cursor:pointer}

  /* добавление / отчёт формы */
  .form-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px;position:sticky;top:0;background:var(--card);z-index:2}
  .form-head .fh-side{font:700 14px 'Manrope';color:var(--blue);border:0;background:none;cursor:pointer;min-width:60px;text-align:left}
  .form-head .fh-side.right{text-align:right}
  .form-head h2{font:800 16px 'Manrope'}
  .form-body{padding:0 18px}
  .field{margin-bottom:14px}
  .field label{font:700 11px 'Manrope';color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;
    font:600 14px 'Manrope';color:var(--ink);outline:none;background:var(--card);appearance:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
  .field textarea{resize:none;height:70px}
  .field .req{color:var(--red)}
  .field-row{display:flex;gap:10px}.field-row .field{flex:1}
  .photo-add{display:flex;gap:8px;margin-top:4px}
  .photo-slot{width:70px;height:70px;border-radius:12px;border:1.5px dashed var(--line);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 9px 'Manrope';color:var(--ink2);cursor:pointer;flex-shrink:0}
  .photo-thumb{width:70px;height:70px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--line)}

  /* избранное список */
  .fav-list{padding:12px}
  .fav-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--sh-s);cursor:pointer}
  .fav-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0}
  .fav-txt{flex:1;min-width:0}
  .fav-txt b{font:700 14.5px 'Manrope';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav-txt span{font:600 12px 'Manrope';color:var(--ink2)}
  .fav-right{text-align:right;flex-shrink:0}
  .fav-dist{font:800 12.5px 'Manrope';color:var(--blue)}
  .fav-more{font-size:18px;color:var(--grey);padding:4px}

  /* профиль */
  .prof-card{background:var(--card);margin:12px;border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-s)}
  .prof-ava{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:800 22px 'Manrope';flex-shrink:0}
  .prof-info b{font:800 17px 'Manrope';display:block}
  .prof-info span{font:600 13px 'Manrope';color:var(--ink2)}
  .prof-list{background:var(--card);margin:0 12px 12px;border-radius:18px;overflow:hidden;box-shadow:var(--sh-s)}
  .prof-row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .prof-row:last-child{border:0}
  .prof-row .pri{width:26px;text-align:center;font-size:17px}
  .prof-row .prl{flex:1;font:700 14.5px 'Manrope'}
  .prof-row .prv{font:700 13px 'Manrope';color:var(--ink2)}
  .prof-row .arr{color:var(--grey);font-size:15px}
  .prof-logout{width:calc(100% - 24px);margin:0 12px;padding:15px;border-radius:16px;background:var(--card);
    color:var(--red);border:0;font:800 15px 'Manrope';cursor:pointer;box-shadow:var(--sh-s)}
  .empty-state{padding:60px 30px;text-align:center}
  .empty-state .ei{font-size:44px;margin-bottom:14px}
  .empty-state b{font:800 16px 'Manrope';display:block;margin-bottom:6px}
  .empty-state span{font:600 13.5px 'Manrope';color:var(--ink2);line-height:1.5}

  /* легенда */
  .legend-body{padding:4px 18px 8px}
  .legend-item{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
  .legend-item:last-child{border:0}
  .legend-mark{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .legend-item b{font:700 14px 'Manrope';display:block}
  .legend-item span{font:600 12px 'Manrope';color:var(--ink2)}

  /* маркеры на карте */
  .marker{position:relative;cursor:pointer}
  .marker .pin{width:34px;height:34px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(18,32,46,.35);border:2.5px solid #fff}
  .marker .pin b{transform:rotate(-45deg);color:#fff;font:800 14px 'Manrope'}
  .marker.big .pin{width:44px;height:44px}
  .marker .bolt{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--violet);
    border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;z-index:2}
  .me-wrap{position:relative;width:22px;height:22px}
  .me-dot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    background:var(--blue);border:3px solid #fff;box-sizing:border-box;
    box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:3}
  .me-dot.rough{background:var(--amber)}
  .me-pulse{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:rgba(37,99,235,.40);animation:mePulse 2.2s ease-out infinite;z-index:1}
  .me-dot.rough ~ .me-pulse,.me-pulse.rough{background:rgba(245,166,35,.40)}
  @keyframes mePulse{0%{transform:scale(1);opacity:.65}70%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}
  .me-cone{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;z-index:2;
    clip-path:polygon(50% 50%, 26% 0%, 74% 0%);
    background:linear-gradient(to top, rgba(37,99,235,0), rgba(37,99,235,.55));
    transform-origin:50% 50%;transition:transform .18s linear}

  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);z-index:400;
    bottom:calc(var(--nav) + 80px + var(--bot));background:var(--ink);color:#fff;font:700 13px 'Manrope';
    padding:13px 20px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;box-shadow:var(--sh)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #maperr{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--bg)}
</style>
</head>
<body>

<!-- ═══════════ ЭКРАН: КАРТА ═══════════ -->
<div id="screen-map">
  <div id="map"></div>
  <div id="maperr">
    <div style="font-size:40px;margin-bottom:12px">🗺️</div>
    <b id="maperr-t" style="font:800 16px Manrope"></b>
    <span id="maperr-p" style="font:600 13px Manrope;color:var(--ink2);margin-top:8px;line-height:1.5"></span>
  </div>

  <div class="topwrap">
    <div class="searchbar">
      <span class="si">🔍</span>
      <input id="search" >
      <button class="bell"><span class="dot"></span>🔔</button>
    </div>
    <div class="qchips" id="qchips"></div>
  </div>

  <button class="legendbtn" id="legendbtn">ⓘ</button>

  <div class="sidefabs">
    <button class="sfab" id="filtbtn">⚙️</button>
    <button class="sfab" id="locbtn">◎</button>
    <div class="accbadge" id="accbadge"></div>
    <div class="zoomcol">
      <button id="zin">+</button>
      <button id="zout">−</button>
    </div>
  </div>

  <div id="minicard"></div>
</div>

<!-- ═══════════ ЭКРАН: ИЗБРАННОЕ ═══════════ -->
<div class="screen" id="screen-fav">
  <div class="scr-head"><h1 id="fav-title"></h1><button class="act" id="fav-edit"></button></div>
  <div id="fav-content"></div>
</div>

async function loadParkingsFromDB(lat, lng, radius){

      radius_m: radius||30000,       // с запасом на весь город на старте
      only_free:false, only_ev:false, max_price:null, lim:500
    };
    const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/parkings_nearby',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('db http '+res.status);
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length){
      PARKINGS = rows.map(fromDbRow);
      render(); draw();
      return true;
    }
    return false;
  }catch(e){
    console.warn('Supabase недоступен, используются запасные данные:', e);
    return false;
  }
}

/* ═══════════ РАССТОЯНИЕ ═══════════ */
function dist(a,b,c,d){
  const R=6371,dl=(c-a)*Math.PI/180,dg=(d-b)*Math.PI/180;
  const h=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function distText(p){
  if(!mePos) return '';
  const km=dist(mePos.lat,mePos.lng,p.lat,p.lng);
  return km<1?Math.round(km*1000)+' м':km.toFixed(1)+' км';
}

function filteredParkings(){
  let v=PARKINGS.slice();
  if(quickFilter==='free')v=v.filter(p=>p.price_type==='free');
  if(quickFilter==='paid')v=v.filter(p=>p.price_type==='paid');

  if(advFilters.price==='free')v=v.filter(p=>p.price_type==='free');
  if(advFilters.price==='paid')v=v.filter(p=>p.price_type==='paid');
  if(advFilters.types.length)v=v.filter(p=>advFilters.types.includes(p.ptype));

  if(advFilters.priceMax<100000)v=v.filter(p=>(p.price_val||0)<=advFilters.priceMax);
  return v;
}
let clusterer=null;
const layoutCache={};
function pinLayout(col,icon,big,bolt){
  const key=col+icon+(big?'1':'0')+(bolt?'1':'0');
  if(layoutCache[key])return layoutCache[key];
  const L=ymaps.templateLayoutFactory.createClass(
    '<div class="marker'+(big?' big':'')+'"><div class="pin" style="background:'+col+'"><b>'+icon+'</b></div>'+(bolt?'<span class="bolt">⚡</span>':'')+'</div>');
  layoutCache[key]=L;return L;
}
function drawMarkers(){
  if(!ymap)return;
  // создаём кластеризатор один раз (ТЗ 7.4 — группировка близких меток)
  if(!clusterer){
    clusterer=new ymaps.Clusterer({
      preset:'islands#invertedBlueClusterIcons', groupByCoordinates:false,
      clusterDisableClickZoom:false, gridSize:64, minClusterSize:3
    });
    ymap.geoObjects.add(clusterer);
  }
  clusterer.removeAll();markers={};
  const pms=filteredParkings().map(p=>{
    const big=p.id===selectedId;
    const m=new ymaps.Placemark([p.lat,p.lng],{parkingId:p.id},{
      iconLayout:pinLayout(markerColor(p),catIcon(p),big,p.ev),
      iconShape:{type:'Circle',coordinates:[0,0],radius:20},iconOffset:[-17,-34]});
    m.events.add('click',()=>selectParking(p.id));
    markers[p.id]=m;return m;
  });
  clusterer.add(pms);
  if(meCircle)ymap.geoObjects.add(meCircle);
  if(meMark)ymap.geoObjects.add(meMark);
}
// лёгкое обновление выделения — меняем макет только двух маркеров, без пересборки всех
let prevSelected=null;
function updateSelection(id){
  if(!clusterer)return drawMarkers();
  [prevSelected,id].forEach(pid=>{
    if(!pid||!markers[pid])return;
    const p=PARKINGS.find(x=>x.id===pid);if(!p)return;
    markers[pid].options.set('iconLayout',pinLayout(markerColor(p),catIcon(p),pid===id,p.ev));
  });
  prevSelected=id;
}
function selectParking(id){
  selectedId=id;updateSelection(id);showMiniCard(id);
  const p=PARKINGS.find(x=>x.id===id);
  if(ymap&&p)ymap.panTo([p.lat,p.lng],{duration:300});
}

/* ═══════════ ГЕОЛОКАЦИЯ (параллельная: сеть + GPS одновременно) ═══════════ */
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const getPos=o=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,o));
async function permState(){try{if(navigator.permissions){const p=await navigator.permissions.query({name:'geolocation'});return p.state}}catch(e){}return'unknown'}
function yandexGeo(){return new Promise((res,rej)=>{if(!window.ymaps||!ymaps.geolocation)return rej();ymaps.geolocation.get({provider:'auto'}).then(r=>{const c=r.geoObjects.get(0).geometry.getCoordinates();res({lat:c[0],lng:c[1],acc:5000})},rej)})}
const GeoPlugin=()=>(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation)||null;

let meAcc=0, userPanned=false, precising=false, gpsGot=false, dbReloadedForUser=false;

/* кэш последней позиции — только если она была точной */
const LP_KEY='parkly-lastpos';
function saveLastPos(lat,lng,acc){ if(acc&&acc>1000)return; try{localStorage.setItem(LP_KEY,JSON.stringify({lat,lng,acc,ts:Date.now()}))}catch(e){} }
function loadLastPos(){try{const o=JSON.parse(localStorage.getItem(LP_KEY)||'null');if(o&&Date.now()-o.ts<12*3600*1000)return o}catch(e){}return null}

/* зум под точность: нельзя показывать зум 16 при погрешности 5 км — это врёт пользователю */
function zoomFor(acc){ if(!acc)return 15; if(acc<50)return 17; if(acc<200)return 16; if(acc<1000)return 14; if(acc<3000)return 12; return 11 }

async function ensurePermission(){
  const Geo=GeoPlugin();
  if(Geo){
    try{
      let p=await Geo.checkPermissions();
      if(p.location!=='granted'&&p.coarseLocation!=='granted'){
        p=await Geo.requestPermissions();
        if(p.location!=='granted'&&p.coarseLocation!=='granted')return false;
      }
      return true;
    }catch(e){return true}
  }
  return (await permState())!=='denied';
}

let pendingCenter=null;
function putMe(lat,lng,acc,rough){
  mePos={lat,lng};meAcc=acc||0;
  if(!ymap){pendingCenter={lat,lng,acc,rough};return}   // карта ещё грузится — применим позже
  if(meMark)ymap.geoObjects.remove(meMark);if(meCircle)ymap.geoObjects.remove(meCircle);
  const isRough = rough || (acc||0)>ROUGH_OVER;
  meCircle=new ymaps.Circle([[lat,lng],Math.max(acc||30,20)],{},
    isRough?{fillColor:'#F5A62322',strokeColor:'#F5A623aa',strokeWidth:1,strokeStyle:'shortdash'}
           :{fillColor:'#2563EB22',strokeColor:'#2563EB55',strokeWidth:1});
  const cone = meHeading!=null
    ? '<div class="me-cone" style="transform:rotate('+Math.round(meHeading)+'deg)"></div>' : '';
  const L=ymaps.templateLayoutFactory.createClass(
    '<div class="me-wrap">'+cone
    +'<div class="me-pulse'+(isRough?' rough':'')+'"></div>'
    +'<div class="me-dot'+(isRough?' rough':'')+'"></div></div>');
  meMark=new ymaps.Placemark([lat,lng],{},{iconLayout:L,iconOffset:[-11,-11],zIndex:900});
  ymap.geoObjects.add(meCircle);ymap.geoObjects.add(meMark);
}

/* применяем координату, если она лучше текущей */
let lastFixTs=0;
const GPS_GOOD=60;      // настоящий спутниковый замер — до 60 м
const ROUGH_OVER=100;   // всё, что хуже 100 м, показываем как приблизительное
const JUNK_OVER=2500;    // хуже 2.5 км — это определение по IP, ему верить нельзя
function applyFix(lat,lng,acc,label,precise){
  // мусорный замер (IP-геолокация) не показываем вовсе, если уже есть что-то лучше
  if(acc>JUNK_OVER&&mePos&&meAcc&&meAcc<acc)return false;
  const stale = Date.now()-lastFixTs>20000;   // старый замер устарел — берём любой новый
  const better = !mePos || !meAcc || acc<=meAcc*0.8 || (precise&&!gpsGot) || stale;
  if(!better)return false;
  lastFixTs=Date.now();
  if(!dbReloadedForUser && acc<3000){ dbReloadedForUser=true; loadParkingsFromDB(lat,lng,15000); }
  const jumped = mePos ? dist(mePos.lat,mePos.lng,lat,lng)>0.2 : true;
  putMe(lat,lng,acc,acc>ROUGH_OVER);
  if(acc<=1000)saveLastPos(lat,lng,acc);
  if(precise)gpsGot=true;
  drawMarkers();
  // переезжаем, если пользователь сам карту не двигал
  if(!userPanned&&(jumped||precise)) ymap&&ymap.setCenter([lat,lng],zoomFor(acc),{duration:450});
  if(label)toast(label+(acc>ROUGH_OVER?' · '+t('approxTilde'):'')+' · ±'+(acc>1000?Math.round(acc/1000)+' км':Math.round(acc)+' м'));
  return true;
}

/* МГНОВЕННО: последняя известная позиция от системы (от любого приложения).
   ВАЖНО: ограничиваем возраст 10 минутами — иначе Android может отдать
   координату многочасовой давности из совсем другого места (ложная "ошибка в 5 км"). */
function instantFix(){
  const Geo=GeoPlugin();
  const o={enableHighAccuracy:false,timeout:3000,maximumAge:600000};
  const wrap=p=>({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});
  return (Geo?Geo.getCurrentPosition(o):getPos(o)).then(wrap);
}

/* быстрый замер: сеть/вышки. Кэш системы разрешаем только совсем свежий (30 сек) */
function fastFix(){
  const Geo=GeoPlugin();
  // в браузере низкая точность = определение по IP (промах в километры),
  // поэтому в вебе сразу просим высокую точность
  const o={enableHighAccuracy:!GeoPlugin(),timeout:7000,maximumAge:30000};
  const wrap=p=>({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});
  return (Geo?Geo.getCurrentPosition(o):getPos(o)).then(wrap);
}

/* КОМПАС: конус направления поворачивается вслед за телефоном */
let meHeading=null, headingInit=false;
function initHeading(){
  if(headingInit)return; headingInit=true;
  const onOrient=e=>{
    let deg=null;
    if(e.webkitCompassHeading!=null)deg=e.webkitCompassHeading;          // iOS
    else if(e.alpha!=null)deg=(e.absolute!==false)?(360-e.alpha):(360-e.alpha);
    if(deg==null||isNaN(deg))return;
    if(meHeading!=null&&Math.abs(deg-meHeading)<4)return;                // не дёргаем на мелочи
    meHeading=deg;
    const el=document.querySelector('.me-cone');
    if(el)el.style.transform='rotate('+Math.round(deg)+'deg)';
    else if(mePos)putMe(mePos.lat,mePos.lng,meAcc);                      // конуса ещё нет — перерисуем
  };
  window.addEventListener('deviceorientationabsolute',onOrient,true);
  window.addEventListener('deviceorientation',onOrient,true);
}

/* живой показ точности — видно, как GPS сходится к нескольким метрам */
let accHintShown=false, accStart=0;
function showAcc(acc){
  const el=document.getElementById('accbadge');if(!el)return;
  el.textContent='±'+(acc>=1000?(acc/1000).toFixed(1)+' км':Math.round(acc)+' м');
  el.className='accbadge on '+(acc<=GPS_GOOD?'good':'bad');
  if(!accStart)accStart=Date.now();
  // если через 30 сек точность всё ещё плохая — честно подсказываем, что делать
  if(!accHintShown&&acc>ROUGH_OVER&&Date.now()-accStart>30000){
    accHintShown=true;toast(t('geoImprove'));
  }
}

/* точный GPS: постоянно слушаем, уточняем точку */
async function startPreciseWatch(){
  if(watchId!=null||precising)return;precising=true;
  const Geo=GeoPlugin();
  const o={enableHighAccuracy:true,timeout:45000,maximumAge:0};
  const onFix=p=>{
    if(!p||!p.coords)return;
    const acc=p.coords.accuracy;
    const first=!gpsGot&&acc<=GPS_GOOD;
    applyFix(p.coords.latitude,p.coords.longitude,acc,first?t('geoPrecise'):null,acc<=GPS_GOOD);
    showAcc(acc);
  };
  try{
    if(Geo) watchId=await Geo.watchPosition(o,onFix);
    else watchId=navigator.geolocation.watchPosition(onFix,()=>{},o);
    document.getElementById('locbtn').classList.add('live');
  }catch(e){precising=false}
}

/* главная: сеть и GPS запускаются ОДНОВРЕМЕННО, кто быстрее — тот и показан */
async function locate(silent){
  userPanned=false;
  if(!GeoPlugin()&&!navigator.geolocation){if(!silent)toast(t('geoNo'));return false}
  if(!isNative&&!GeoPlugin()&&location.protocol!=='https:'&&location.hostname!=='localhost'){if(!silent)toast(t('geoHttp'));return false}

  // мгновенно: последняя точная точка из кэша
  const cached=loadLastPos();
  if(cached&&!mePos){putMe(cached.lat,cached.lng,cached.acc);drawMarkers();
    if(ymap)ymap.setCenter([cached.lat,cached.lng],zoomFor(cached.acc));
    if(!silent)toast(t('geoCached'))}
  else if(!silent)toast(t('geoing'));

  const ok=await ensurePermission();
  if(!ok){if(!silent)toast(t('geoDeny'));return false}

  gpsGot=false;
  startPreciseWatch();                       // GPS стартует СРАЗУ, не ждёт сеть

  // МГНОВЕННО: системная последняя позиция (обычно 0-100 мс)
  instantFix().then(i=>{
    if(gpsGot)return;
    applyFix(i.lat,i.lng,i.acc,silent?null:(i.acc<=ROUGH_OVER?t('geoOk'):t('geoRoughWait')),false);
  }).catch(()=>{});

  // сеть — как быстрая заглушка, пока GPS ищет спутники
  fastFix().then(f=>{
    if(gpsGot)return;                        // GPS уже успел — грубую не показываем
    applyFix(f.lat,f.lng,f.acc,silent?null:(f.acc>1000?t('geoRoughWait'):t('geoOk')),false);
  }).catch(e=>{
    if(e&&e.code===1&&!silent)toast(t('geoDeny'));
  });

  // если через 25 сек GPS так и не поймал — честно говорим
  setTimeout(()=>{ if(!gpsGot&&!silent&&mePos&&meAcc>500)toast(t('geoStillRough')) },25000);

  // совсем нет ничего — грубо по IP через Яндекс
  setTimeout(async()=>{
    if(mePos)return;
    try{const y=await yandexGeo();applyFix(y.lat,y.lng,y.acc,silent?null:t('geoRough'),false)}catch(e){}
  },8000);

  return true;
}

/* если пользователь сам двигает карту — перестаём её перецентровывать */
function trackPan(){ if(!ymap)return;
  ymap.events.add('actionbegin',()=>{userPanned=true});
}

document.getElementById('locbtn').onclick=()=>locate(false);
document.getElementById('zin').onclick=()=>ymap&&ymap.setZoom(ymap.getZoom()+1,{duration:200});
document.getElementById('zout').onclick=()=>ymap&&ymap.setZoom(ymap.getZoom()-1,{duration:200});
document.getElementById('filtbtn').onclick=openFilters;

/* ═══════════ МАРШРУТ ═══════════ */
let route=null,routeTarget=null,routeMode='auto';
async function routeTo(id,mode){
  const p=PARKINGS.find(x=>x.id===id);if(!p||!ymap)return;
  if(!mePos){toast(t('needGeoRoute'));const ok=await locate(true);if(!ok){toast(t('geoDeny'));return}}
  routeTarget=p;routeMode=mode||routeMode;
  document.getElementById('minicard').classList.remove('on');
  clearRoute();drawRoutePanel(null);
  route=new ymaps.multiRouter.MultiRoute({referencePoints:[[mePos.lat,mePos.lng],[p.lat,p.lng]],params:{routingMode:routeMode,results:1,avoidTrafficJams:true}},
    {boundsAutoApply:true,zoomMargin:[120,40,220,40],wayPointVisible:false,pinVisible:false,routeActiveStrokeWidth:6,routeActiveStrokeColor:'2563EB',routeActivePedestrianSegmentStrokeColor:'1FA84C',routeStrokeWidth:4,routeStrokeColor:'8FA3AE88'});
  route.model.events.add('requestsuccess',()=>{const a=route.getActiveRoute();if(!a){fallbackRoute(p);return}
    const d=a.properties.get('distance'),dur=a.properties.get('durationInTraffic')||a.properties.get('duration');
    drawRoutePanel({dist:d&&d.text,time:dur&&dur.text})});
  route.model.events.add('requestfail',()=>fallbackRoute(p));
  ymap.geoObjects.add(route);
}
function fallbackRoute(p){
  clearRoute();
  route=new ymaps.Polyline([[mePos.lat,mePos.lng],[p.lat,p.lng]],{},{strokeColor:'#2563EB',strokeWidth:4,strokeStyle:'shortdash'});
  ymap.geoObjects.add(route);
  ymap.setBounds([[Math.min(mePos.lat,p.lat),Math.min(mePos.lng,p.lng)],[Math.max(mePos.lat,p.lat),Math.max(mePos.lng,p.lng)]],{checkZoomRange:true,zoomMargin:[120,40,220,40]});
  const km=dist(mePos.lat,mePos.lng,p.lat,p.lng),sp=routeMode==='pedestrian'?4.5:22;
  drawRoutePanel({dist:km.toFixed(1)+' км',time:Math.max(1,Math.round(km/sp*60))+' '+t('min'),rough:true});
}
function clearRoute(){if(route&&ymap){ymap.geoObjects.remove(route);route=null}}
function closeRoute(){clearRoute();routeTarget=null;document.getElementById('minicard').classList.remove('on');
  const rp=document.getElementById('routepanel');if(rp)rp.remove()}
function drawRoutePanel(info){
  const p=routeTarget;if(!p)return;
  let rp=document.getElementById('routepanel');
  if(!rp){rp=document.createElement('div');rp.id='routepanel';
    rp.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--bot));z-index:59;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px 16px';
    document.getElementById('screen-map').appendChild(rp)}

function submitAdd(){
  const addr=document.getElementById('a_addr').value.trim();

  // По ТЗ: заявка уходит в статус PENDING на модерацию (в MVP без сервера — сохраняем локально)
  const subs=JSON.parse(localStorage.getItem('parkly-submissions')||'[]');
  subs.push({name:document.getElementById('a_name').value,addr,cat:document.getElementById('a_cat').value,
    status:'PENDING',date:new Date().toISOString()});
  localStorage.setItem('parkly-submissions',JSON.stringify(subs));

function buildNav(){
  const items=[['map','◉',t('navMap')],['fav','★',t('navFav')],['add','＋',t('navAdd')],['profile','◍',t('navProfile')]];
  document.getElementById('bottomnav').innerHTML=items.map(([k,ic,l])=>
    k==='add'
    ?'<button class="navitem navadd" data-tab="add"><span class="ni">＋</span><span>'+l+'</span></button>'
    :'<button class="navitem'+(activeTab===k?' on':'')+'" data-tab="'+k+'"><span class="ni">'+ic+'</span><span>'+l+'</span></button>'
  ).join('');
  document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>{
    const tab=b.dataset.tab;
    if(tab==='add'){openAdd();return}
    switchTab(tab);
  });
}
function switchTab(tab){
  activeTab=tab;
  document.getElementById('screen-fav').classList.toggle('on',tab==='fav');
  document.getElementById('screen-profile').classList.toggle('on',tab==='profile');
  if(tab==='fav')renderFav();
  if(tab==='profile')renderProfile();
  buildNav();
}

/* АВТООПРЕДЕЛЕНИЕ ПРИ ЗАПУСКЕ (как в Яндекс.Картах).
   Кэш показываем сразу, а системный запрос разрешения откладываем,
   пока окно приложения не окажется реально на экране — иначе Android
   иногда "теряет" диалог, если его показать во время сплэша/анимации запуска. */
(function bootLocate(){
  // 1) мгновенно: наш сохранённый кэш (0 мс) — точка есть до загрузки карты
  const cached=loadLastPos();
  if(cached)putMe(cached.lat,cached.lng,cached.acc);

  async function tryGrantOnce(){
    const Geo=GeoPlugin();
    try{
      if(Geo){
        const p=await Geo.checkPermissions();
        if(p.location==='granted'||p.coarseLocation==='granted')return true;
        const r=await Geo.requestPermissions();
        return (r.location==='granted'||r.coarseLocation==='granted');
      }
      return (await permState())!=='denied';
    }catch(e){return false}
  }

  async function afterGrant(){
    gpsGot=false;
    startPreciseWatch();
    instantFix().then(i=>{if(!gpsGot)applyFix(i.lat,i.lng,i.acc,null,false)}).catch(()=>{});
    fastFix().then(f=>{if(!gpsGot)applyFix(f.lat,f.lng,f.acc,null,false)}).catch(()=>{});
    // пока спутники не пойманы — раз в 5 сек пробуем сеть заново (данные Wi-Fi/вышек
    // могут уточниться по мере сканирования), но не дольше минуты
    for(let i=0;i<12&&!gpsGot;i++){
      await new Promise(r=>setTimeout(r,5000));
      if(gpsGot)break;
      try{const f=await fastFix();applyFix(f.lat,f.lng,f.acc,null,false)}catch(e){}
    }
  }

  async function run(){
    let granted=await tryGrantOnce();
    if(!granted){
      // окно приложения могло быть ещё не в фокусе — пробуем ещё раз чуть позже
      await new Promise(r=>setTimeout(r,1200));
      granted=await tryGrantOnce();
    }
    if(granted)afterGrant();
    // если так и не дали доступ — молча остаёмся на Ташкенте, кнопка ◎ остаётся рабочей
  }

  // ждём, пока окно реально прогрузится (не просто DOM, а весь load),
  // плюс небольшая пауза — Android должен успеть показать нативное окно поверх сплэша
  const start=()=>setTimeout(run,900);
  if(document.readyState==='complete')start();
  else window.addEventListener('load',start);
})();
</script>
