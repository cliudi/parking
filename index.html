<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1B2A">
<title>Parkly — parkovkalar / парковки Ташкента</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1B2A; --bg:#EEF2F4; --card:#FFF;
    --blue:#1156D6; --teal:#17A398; --amber:#F4A300; --green:#2FA84F; --violet:#7A5CFF;
    --muted:#6B7A85; --line:#E2E8EB;
    --sh:0 6px 22px rgba(14,27,42,.16);
    --top:env(safe-area-inset-top,0px);
    --bot:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Manrope',sans-serif;color:var(--ink);background:var(--bg)}
  #map{position:fixed;inset:0;z-index:1}
  .top{position:fixed;top:calc(10px + var(--top));left:10px;right:10px;z-index:60;display:flex;gap:8px}
  .bar{flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;padding:9px 12px;box-shadow:var(--sh);min-width:0}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;font:800 15px 'Unbounded';display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bar input{border:0;outline:none;background:none;width:100%;font:600 14px 'Manrope';color:var(--ink);min-width:0}
  .bar input::placeholder{color:var(--muted)}
  .lang{background:var(--card);border-radius:14px;box-shadow:var(--sh);border:0;padding:0 13px;font:800 13px 'Manrope';color:var(--ink);cursor:pointer;flex-shrink:0}
  .chips{position:fixed;top:calc(62px + var(--top));left:10px;right:10px;z-index:60;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:7px 12px;border-radius:999px;background:var(--card);border:0;font:700 12px 'Manrope';color:var(--ink);box-shadow:0 2px 10px rgba(14,27,42,.14);cursor:pointer;display:flex;align-items:center;gap:5px}
  .chip.on{background:var(--ink);color:#fff}
  .fabs{position:fixed;right:12px;z-index:60;display:flex;flex-direction:column;gap:9px;bottom:calc(var(--peek,96px) + 12px + var(--bot));transition:bottom .28s cubic-bezier(.4,0,.2,1)}
  .fab{width:46px;height:46px;border-radius:14px;background:var(--card);border:0;box-shadow:var(--sh);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .fab:active{transform:scale(.93)}
  .fab.on{background:var(--blue);color:#fff}
  .fab.live{background:var(--teal);color:#fff}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(14,27,42,.16);height:var(--peek,96px);transition:height .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-bottom:var(--bot)}
  .grab{padding:9px 0 3px;display:flex;justify-content:center;cursor:grab;touch-action:none}
  .grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
  .shead{display:flex;align-items:baseline;justify-content:space-between;padding:2px 18px 9px;cursor:pointer}
  .shead h2{font:600 13.5px 'Unbounded'}
  .shead span{font:700 11.5px 'Manrope';color:var(--muted)}
  #list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 14px;flex:1}
  .row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border:0}
  .ic{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
  .rt{flex:1;min-width:0}
  .rt b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt span{font:600 11.5px 'Manrope';color:var(--muted);display:flex;align-items:center;gap:6px}
  .tag{font:700 9px 'Manrope';padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;color:#fff;flex-shrink:0}
  .rd{font:800 12px 'Manrope';color:var(--blue);white-space:nowrap}
  .empty{padding:26px;text-align:center;color:var(--muted);font:700 13px 'Manrope';line-height:1.6}
  .mask{position:fixed;inset:0;background:rgba(14,27,42,.5);z-index:200;display:none;align-items:flex-end}
  .mask.open{display:flex}
  .modal{background:var(--card);width:100%;border-radius:24px 24px 0 0;overflow:hidden;animation:up .26s cubic-bezier(.2,.8,.3,1);max-height:90vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
  .photo{width:100%;height:170px;object-fit:cover;background:var(--line) center/cover;display:block}
  .mbody{padding:14px 20px calc(24px + var(--bot))}
  .grabm{padding:0;display:flex;justify-content:center;position:absolute;left:0;right:0;top:8px}
  .grabm i{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
  .ctop{display:flex;gap:13px;align-items:flex-start}
  .ctop .ic{width:52px;height:52px;font-size:24px}
  .ctop h3{font:600 15.5px 'Unbounded';line-height:1.3}
  .ctop p{font:600 12px 'Manrope';color:var(--muted);margin-top:3px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .stats{display:flex;gap:7px;margin:14px 0}
  .stat{flex:1;background:var(--bg);border-radius:14px;padding:11px 6px;text-align:center}
  .stat b{font:600 13.5px 'Unbounded';display:block}
  .stat span{font:700 8.5px 'Manrope';color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .acts{display:flex;gap:9px;margin-top:4px}
  .btn{flex:1;padding:15px;border-radius:14px;border:0;font:800 13.5px 'Manrope';cursor:pointer;text-align:center;text-decoration:none;display:block;color:#fff}
  .btn.go{background:var(--blue)}
  .btn.gh{background:var(--bg);color:var(--ink);flex:0 0 auto;padding:15px 18px}
  #rp{position:fixed;left:10px;right:10px;bottom:calc(14px + var(--bot));z-index:95;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:13px 15px;display:none}
  #rp.on{display:block;animation:up .25s cubic-bezier(.2,.8,.3,1)}
  .rphead{display:flex;align-items:center;gap:11px}
  .rpname{flex:1;min-width:0}
  .rpname b{font:700 13.5px 'Manrope';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rpname span{font:600 11.5px 'Manrope';color:var(--muted)}
  .rpbig{text-align:right;flex-shrink:0}
  .rpbig b{font:600 16px 'Unbounded';color:var(--blue);display:block;line-height:1.15}
  .rpbig span{font:700 10px 'Manrope';color:var(--muted)}
  .rpx{width:34px;height:34px;border-radius:11px;background:var(--bg);border:0;font-size:15px;cursor:pointer;flex-shrink:0;color:var(--ink)}
  .rpmodes{display:flex;gap:7px;margin-top:11px}
  .rpm{flex:1;padding:9px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font:700 12px 'Manrope';cursor:pointer;color:var(--ink)}
  .rpm.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rpnav{width:100%;margin-top:8px;padding:12px;border-radius:12px;background:var(--blue);color:#fff;border:0;font:800 12.5px 'Manrope';cursor:pointer;display:block;text-align:center;text-decoration:none}
  .routing #sheet{opacity:0;pointer-events:none;transition:.2s}
  .routing .fabs{bottom:calc(var(--rph,150px) + 12px + var(--bot))}
  .pm{width:42px;height:42px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 11px rgba(14,27,42,.4);border:3px solid #fff;cursor:pointer}
  .pm span{transform:rotate(-45deg);font-size:19px;line-height:1}
  .me{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(17,86,214,.22),0 2px 8px rgba(0,0,0,.3)}
  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);z-index:300;bottom:calc(var(--peek,96px) + 70px);background:var(--ink);color:#fff;font:700 12.5px 'Manrope';padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #warn{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg);text-align:center}
  #warn .b{max-width:400px;background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--sh)}
  #warn h3{font:600 15px 'Unbounded';margin-bottom:10px}
  #warn p{font:600 13px 'Manrope';color:var(--muted);line-height:1.65}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="bar"><div class="logo">P</div><input id="q"></div>
  <button class="lang" id="lang">UZ</button>
</div>
<div class="chips" id="chips"></div>
<div class="fabs">
  <button class="fab" id="trafbtn" title="traffic">🚦</button>
  <button class="fab" id="locbtn" title="geo">📍</button>
</div>
<div id="rp"></div>
<div id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="shead" id="shead"><h2 id="stitle"></h2><span id="count"></span></div>
  <div id="list"></div>
</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="warn"><div class="b"><h3 id="warnt"></h3><p id="warnp"></p></div></div>
<script>
const YANDEX_API_KEY = 'be1856ef-50e1-40ed-abb7-80a23f99ddb3';
const TYPES={
  paid:   {color:'#1156D6', icon:'🅿️'},
  free:   {color:'#2FA84F', icon:'🅿️'},
  ev:     {color:'#7A5CFF', icon:'⚡'},
  allowed:{color:'#F4A300', icon:'✅'},
};
const T={
 ru:{
  ph:'Поиск: адрес или объект…', near:'Парковки', of:'из',
  all:'Все', free:'Бесплатные', paid:'Платные', ev:'⚡ Зарядка EV', allowed:'✅ Разрешённые',
  spots:'мест', approx:'≈', freeP:'Бесплатно', sum:'сум/ч', mode:'режим работы',
  capacity:'вместимость', type:'тип', nores:'Ничего не найдено.<br>Измените фильтр или запрос.',
  tPaid:'Платная', tFree:'Бесплатная', tEv:'Зарядка EV', tAllowed:'Разрешена по ПДД',
  route:'Проложить маршрут', byCar:'На машине', onFoot:'Пешком',
  building:'строю…', min:'мин', rough:'примерно', openNav:'Открыть в Навигаторе →',
  needGeo:'Сначала определите своё местоположение',
  geoing:'Определяю местоположение…', geoOk:'Вы здесь · точность',
  geoRetry:'GPS не отвечает, пробую по сети…', geoRough:'Примерное местоположение (по сети)',
  geoDeny:'Доступ запрещён. Нажмите 🔒 в адресной строке → Разрешения → Геоданные',
  geoBlocked:'Сайту запрещён доступ к геолокации в настройках браузера',
  geoUnav:'Местоположение недоступно. Включите GPS',
  geoTime:'Не удалось определить. Попробуйте на улице',
  geoNo:'Геолокация не поддерживается', geoHttp:'Геолокация работает только на HTTPS',
  geoManual:'Точка установлена вручную', live:'Слежение включено', liveOff:'Слежение выключено',
  trafOn:'Пробки включены', trafOff:'Пробки выключены', noPhoto:'Фото пока нет',
  warnT:'Карта не загрузилась', warnP:'Проверьте интернет или домен в кабинете Яндекс API.'
 },
 uz:{
  ph:'Qidiruv: manzil yoki obyekt…', near:'Parkovkalar', of:'/',
  all:'Barchasi', free:'Bepul', paid:'Pullik', ev:'⚡ EV quvvat', allowed:'✅ Ruxsat etilgan',
  spots:'joy', approx:'≈', freeP:'Bepul', sum:'so\u2018m/soat', mode:'ish vaqti',
  capacity:'sig\u2018imi', type:'turi', nores:'Hech narsa topilmadi.<br>Filtrni o\u2018zgartiring.',
  tPaid:'Pullik', tFree:'Bepul', tEv:'EV quvvatlash', tAllowed:'YHQ bo\u2018yicha ruxsat',
  route:'Yo\u2018nalish qurish', byCar:'Mashinada', onFoot:'Piyoda',
  building:'qurilmoqda…', min:'daq', rough:'taxminan', openNav:'Navigatorda ochish →',
  needGeo:'Avval joylashuvingizni aniqlang',
  geoing:'Joylashuv aniqlanmoqda…', geoOk:'Siz shu yerdasiz · aniqlik',
  geoRetry:'GPS javob bermayapti, tarmoq orqali…', geoRough:'Taxminiy joylashuv (tarmoq bo\u2018yicha)',
  geoDeny:'Ruxsat berilmagan. 🔒 → Ruxsatlar → Joylashuv',
  geoBlocked:'Brauzer sozlamalarida joylashuvga ruxsat yo\u2018q',
  geoUnav:'Joylashuv mavjud emas. GPS\u2019ni yoqing',
  geoTime:'Aniqlanmadi. Ko\u2018chada urinib ko\u2018ring',
  geoNo:'Geolokatsiya qo\u2018llab-quvvatlanmaydi', geoHttp:'Geolokatsiya faqat HTTPS\u2019da ishlaydi',
  geoManual:'Nuqta qo\u2018lda belgilandi', live:'Kuzatuv yoqildi', liveOff:'Kuzatuv o\u2018chirildi',
  trafOn:'Tirbandlik yoqildi', trafOff:'Tirbandlik o\u2018chirildi', noPhoto:'Foto hozircha yo\u2018q',
  warnT:'Xarita yuklanmadi', warnP:'Internet yoki Yandex API domenini tekshiring.'
 }
};
let lang=localStorage.getItem('pl-lang')||'ru';
const t=k=>T[lang][k];
function typeName(tp){return t(tp==='paid'?'tPaid':tp==='free'?'tFree':tp==='ev'?'tEv':'tAllowed')}
const SPOTS=[
 {id:'chorsu', name:'Чорсу / Chorsu',      addr:'Eski shahar, Navoiy ko\u2018chasi', lat:41.3266,lng:69.2345,type:'paid', cap:150,price:3000, hours:'06:00–20:00', photo:'https://images.unsplash.com/photo-1590674899484-d5640e854abe?w=600'},
 {id:'magic',  name:'Magic City Park',      addr:'Bobur ko\u2018chasi, 174',          lat:41.2846,lng:69.2274,type:'paid', cap:400,price:5000, hours:'24/7',        photo:'https://images.unsplash.com/photo-1573348722427-f1d6819fdf98?w=600'},
 {id:'mega',   name:'Mega Planet',          addr:'Kichik Halqa Yo\u2018li',           lat:41.3452,lng:69.2860,type:'free', cap:300,price:0,    hours:'10:00–22:00', photo:'https://images.unsplash.com/photo-1545179605-1296651e9d43?w=600'},
 {id:'samdar', name:'Samarqand Darvoza',    addr:'Qoratosh ko\u2018chasi, 5A',        lat:41.3163,lng:69.2312,type:'free', cap:250,price:0,    hours:'10:00–23:00', photo:''},
 {id:'tcity',  name:'Tashkent City Park',   addr:'Islom Karimov ko\u2018chasi',       lat:41.3138,lng:69.2481,type:'ev',   cap:500,price:6000, hours:'24/7',        photo:''},
 {id:'next',   name:'NEXT',                 addr:'Bobur ko\u2018chasi, 2',            lat:41.2953,lng:69.2670,type:'free', cap:350,price:0,    hours:'10:00–23:00', photo:''},
 {id:'timur',  name:'Amir Temur xiyoboni',  addr:'Amir Temur shoh ko\u2018chasi',     lat:41.3111,lng:69.2797,type:'allowed',cap:80,price:0,  hours:'24/7',        photo:''},
 {id:'alay',   name:'Oloy bozori',          addr:'Amir Temur, 42',               lat:41.3208,lng:69.2853,type:'paid', cap:100,price:3000, hours:'06:00–20:00', photo:''},
 {id:'rail',   name:'Toshkent vokzali',     addr:'Vokzal maydoni',               lat:41.2907,lng:69.2874,type:'paid', cap:200,price:4000, hours:'24/7',        photo:''},
 {id:'compass',name:'Compass',              addr:'Farg\u2018ona Yo\u2018li',               lat:41.2822,lng:69.3140,type:'ev',   cap:280,price:0,    hours:'10:00–22:00', photo:''},
 {id:'minor',  name:'Minor masjidi',        addr:'Kichik Halqa Yo\u2018li',           lat:41.3347,lng:69.2683,type:'free', cap:60, price:0,    hours:'05:00–22:00', photo:''},
 {id:'airport',name:'Aeroport T2',          addr:'Hamid Olimjon, 41',            lat:41.2612,lng:69.2823,type:'paid', cap:450,price:10000,hours:'24/7',        photo:''},
 {id:'yunus',  name:'Yunusobod (ko\u2018cha)', addr:'Yunusobod 4-mavze',            lat:41.3670,lng:69.2890,type:'allowed',cap:40,price:0,  hours:'24/7',        photo:''},
];
let filter='all', query='';
let ymap=null, pmarks={}, meMark=null, meCircle=null, traffic=null;
let mePos=null, watchId=null;
function loadYandex(){
  const sc=document.createElement('script');
  sc.src='https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey='+YANDEX_API_KEY;
  sc.onload=()=>ymaps.ready(initMap);
  sc.onerror=showWarn;
  document.head.appendChild(sc);
  setTimeout(()=>{if(!ymap)showWarn()},9000);
}
function showWarn(){
  document.getElementById('warnt').textContent=t('warnT');
  document.getElementById('warnp').textContent=t('warnP');
  document.getElementById('warn').style.display='flex';
}
function initMap(){
  ymap=new ymaps.Map('map',{center:[41.3111,69.2650],zoom:13,controls:[]},{suppressMapOpenBlock:true,yandexMapDisablePoiInteractivity:true});
  document.getElementById('warn').style.display='none';
  draw(); enableManualPin();
}
function draw(){
  if(!ymap)return;
  Object.values(pmarks).forEach(p=>ymap.geoObjects.remove(p)); pmarks={};
  visible().forEach(s=>{
    const T0=TYPES[s.type];
    const L=ymaps.templateLayoutFactory.createClass('<div class="pm" style="background:'+T0.color+'"><span>'+T0.icon+'</span></div>');
    const pm=new ymaps.Placemark([s.lat,s.lng],{},{iconLayout:L,iconShape:{type:'Circle',coordinates:[0,0],radius:21},iconOffset:[-21,-38]});
    pm.events.add('click',()=>openCard(s.id));
    ymap.geoObjects.add(pm); pmarks[s.id]=pm;
  });
  if(meCircle)ymap.geoObjects.add(meCircle);
  if(meMark)ymap.geoObjects.add(meMark);
}
function dist(a,b,c,d){
  const R=6371,dl=(c-a)*Math.PI/180,dg=(d-b)*Math.PI/180;
  const h=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function visible(){
  let v=SPOTS.filter(s=>(s.name+s.addr).toLowerCase().includes(query));
  if(filter==='free')v=v.filter(s=>s.type==='free');
  if(filter==='paid')v=v.filter(s=>s.type==='paid');
  if(filter==='ev')v=v.filter(s=>s.type==='ev');
  if(filter==='allowed')v=v.filter(s=>s.type==='allowed');
  if(mePos)v.sort((a,b)=>dist(mePos.lat,mePos.lng,a.lat,a.lng)-dist(mePos.lat,mePos.lng,b.lat,b.lng));
  else v.sort((a,b)=>b.cap-a.cap);
  return v;
}
const fmtP=(s)=>s.type==='ev'?'⚡ '+(s.price?s.price.toLocaleString('ru')+' '+t('sum'):t('freeP')):(s.price===0?t('freeP'):s.price.toLocaleString('ru')+' '+t('sum'));
function render(){
  const v=visible();
  document.getElementById('count').textContent=v.length+' '+t('of')+' '+SPOTS.length;
  document.getElementById('list').innerHTML = v.length? v.map(s=>{
    const T0=TYPES[s.type];
    return '<div class="row" onclick="openCard(\''+s.id+'\')">'
      +'<div class="ic" style="background:'+T0.color+'">'+T0.icon+'</div>'
      +'<div class="rt"><b>'+s.name+'</b>'
      +'<span><span class="tag" style="background:'+T0.color+'">'+typeName(s.type)+'</span>'+fmtP(s)+'</span></div>'
      +(mePos?'<div class="rd">'+dist(mePos.lat,mePos.lng,s.lat,s.lng).toFixed(1)+' km</div>'
             :'<div class="rd">'+t('approx')+s.cap+'</div>')
      +'</div>';
  }).join('') : '<div class="empty">'+t('nores')+'</div>';
  draw();
}
window.openCard=function(id){
  const s=SPOTS.find(x=>x.id===id); if(!s)return;
  const T0=TYPES[s.type];
  const photo=s.photo
    ? '<img class="photo" src="'+s.photo+'" alt="" onerror="this.style.display=\'none\'">'
    : '<div class="photo" style="display:flex;align-items:center;justify-content:center;font:700 12px Manrope;color:var(--muted)">'+t('noPhoto')+'</div>';
  document.getElementById('modal').innerHTML=
    '<div style="position:relative">'+photo+'<div class="grabm" onclick="closeMask()"><i></i></div></div>'
    +'<div class="mbody">'
    +'<div class="ctop"><div class="ic" style="background:'+T0.color+'">'+T0.icon+'</div>'
    +'<div><h3>'+s.name+'</h3><p>'+s.addr+'</p></div></div>'
    +'<div class="badges"><span class="tag" style="background:'+T0.color+'">'+typeName(s.type)+'</span>'
    +(s.type==='ev'?'<span class="tag" style="background:var(--violet)">⚡ EV</span>':'')+'</div>'
    +'<div class="stats">'
    +'<div class="stat"><b>'+(s.price?s.price.toLocaleString('ru'):t('freeP'))+'</b><span>'+(s.price?t('sum'):'—')+'</span></div>'
    +'<div class="stat"><b>'+t('approx')+' '+s.cap+'</b><span>'+t('capacity')+'</span></div>'
    +'<div class="stat"><b style="font-size:11px">'+s.hours+'</b><span>'+t('mode')+'</span></div>'
    +'</div>'
    /* Занятость в реальном времени — не входит в MVP по ТЗ, включим позже */
    +'<div class="acts">'
    +'<button class="btn go" onclick="routeTo(\''+s.id+'\')">'+t('route')+'</button>'
    +'<button class="btn gh" onclick="closeMask()">✕</button></div>'
    +'</div>';
  document.getElementById('mask').classList.add('open');
  if(ymap)ymap.setCenter([s.lat,s.lng],15,{duration:400});
};
window.closeMask=()=>document.getElementById('mask').classList.remove('open');
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')closeMask()};
function toast(x){
  const el=document.getElementById('toast');
  el.innerHTML=x; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600);
}
const getPos=o=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,o));
async function permState(){try{if(navigator.permissions){const p=await navigator.permissions.query({name:'geolocation'});return p.state}}catch(e){}return 'unknown'}
function yandexGeo(){return new Promise((res,rej)=>{if(!window.ymaps||!ymaps.geolocation)return rej();ymaps.geolocation.get({provider:'auto'}).then(r=>{const c=r.geoObjects.get(0).geometry.getCoordinates();res({lat:c[0],lng:c[1],acc:3000})},rej)})}
function putMe(lat,lng,acc){
  mePos={lat,lng};
  if(!ymap)return;
  if(meMark)ymap.geoObjects.remove(meMark);
  if(meCircle)ymap.geoObjects.remove(meCircle);
  meCircle=new ymaps.Circle([[lat,lng],Math.max(acc,20)],{},{fillColor:'#1156D622',strokeColor:'#1156D655',strokeWidth:1});
  const L=ymaps.templateLayoutFactory.createClass('<div class="me"></div>');
  meMark=new ymaps.Placemark([lat,lng],{},{iconLayout:L,iconOffset:[-9,-9],zIndex:900});
  ymap.geoObjects.add(meCircle); ymap.geoObjects.add(meMark);
}
function applyPos(lat,lng,acc,z){putMe(lat,lng,acc);if(ymap)ymap.setCenter([lat,lng],z,{duration:500});render()}
document.getElementById('locbtn').onclick=async function(){
  const b=this;
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;b.classList.remove('live');toast(t('liveOff'));return}
  if(!navigator.geolocation){toast(t('geoNo'));return}
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){toast(t('geoHttp'));return}
  if(await permState()==='denied'){toast(t('geoBlocked'));return}
  toast(t('geoing'));
  let p=null,e1=null;
  try{p=await getPos({enableHighAccuracy:true,timeout:12000,maximumAge:0})}catch(e){e1=e}
  if(!p&&e1&&e1.code!==1){toast(t('geoRetry'));try{p=await getPos({enableHighAccuracy:false,timeout:20000,maximumAge:120000})}catch(e){e1=e}}
  if(p){
    applyPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy,16);
    toast(t('geoOk')+' ±'+Math.round(p.coords.accuracy)+' m');
    watchId=navigator.geolocation.watchPosition(q=>{putMe(q.coords.latitude,q.coords.longitude,q.coords.accuracy);render()},()=>{},{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
    b.classList.add('live'); return;
  }
  if(e1&&e1.code===1){toast(t('geoDeny'));return}
  try{const y=await yandexGeo();applyPos(y.lat,y.lng,y.acc,13);toast(t('geoRough'))}
  catch(e){toast(e1&&e1.code===2?t('geoUnav'):t('geoTime'))}
};
function enableManualPin(){if(!ymap)return;ymap.events.add('contextmenu',e=>{const c=e.get('coords');applyPos(c[0],c[1],30,ymap.getZoom());toast(t('geoManual'))})}
document.getElementById('trafbtn').onclick=function(){
  if(!ymap)return;
  if(!traffic){traffic=new ymaps.traffic.provider.Actual({},{infoLayerShown:true});traffic.setMap(ymap);this.classList.add('on');toast(t('trafOn'))}
  else{traffic.setMap(null);traffic=null;this.classList.remove('on');toast(t('trafOff'))}
};
let route=null,routeTarget=null,routeMode='auto';
window.routeTo=function(id,mode){
  const s=SPOTS.find(x=>x.id===id); if(!s||!ymap)return;
  if(!mePos){closeMask();toast(t('needGeo'));document.getElementById('locbtn').click();return}
  routeTarget=s; routeMode=mode||routeMode;
  closeMask(); setSnap(0); document.body.classList.add('routing');
  drawRoutePanel(null); clearRoute();
  route=new ymaps.multiRouter.MultiRoute({referencePoints:[[mePos.lat,mePos.lng],[s.lat,s.lng]],params:{routingMode:routeMode,results:1,avoidTrafficJams:true}},
    {boundsAutoApply:true,zoomMargin:[90,40,190,40],wayPointVisible:false,pinVisible:false,routeActiveStrokeWidth:6,routeActiveStrokeColor:'1156D6',routeActivePedestrianSegmentStrokeColor:'17A398',routeStrokeWidth:4,routeStrokeColor:'8FA3AE88'});
  route.model.events.add('requestsuccess',()=>{
    const a=route.getActiveRoute(); if(!a){fallbackRoute(s);return}
    const d=a.properties.get('distance'),dur=a.properties.get('durationInTraffic')||a.properties.get('duration');
    drawRoutePanel({dist:d&&d.text,time:dur&&dur.text});
  });
  route.model.events.add('requestfail',()=>fallbackRoute(s));
  ymap.geoObjects.add(route);
};
function fallbackRoute(s){
  clearRoute();
  route=new ymaps.Polyline([[mePos.lat,mePos.lng],[s.lat,s.lng]],{},{strokeColor:'#1156D6',strokeWidth:4,strokeStyle:'shortdash'});
  ymap.geoObjects.add(route);
  ymap.setBounds([[Math.min(mePos.lat,s.lat),Math.min(mePos.lng,s.lng)],[Math.max(mePos.lat,s.lat),Math.max(mePos.lng,s.lng)]],{checkZoomRange:true,zoomMargin:[90,40,190,40]});
  const km=dist(mePos.lat,mePos.lng,s.lat,s.lng),sp=routeMode==='pedestrian'?4.5:22;
  drawRoutePanel({dist:km.toFixed(1)+' km',time:Math.max(1,Math.round(km/sp*60))+' '+t('min'),rough:true});
}
function clearRoute(){if(route&&ymap){ymap.geoObjects.remove(route);route=null}}
window.closeRoute=function(){clearRoute();routeTarget=null;document.body.classList.remove('routing');document.getElementById('rp').classList.remove('on')};
function drawRoutePanel(info){
  const s=routeTarget; if(!s)return;
  const T0=TYPES[s.type], el=document.getElementById('rp');
  el.classList.add('on');
  el.innerHTML='<div class="rphead">'
    +'<div class="ic" style="background:'+T0.color+';width:40px;height:40px;border-radius:11px;font-size:18px">'+T0.icon+'</div>'
    +'<div class="rpname"><b>'+s.name+'</b><span>'+fmtP(s)+(info&&info.rough?' · '+t('rough'):'')+'</span></div>'
    +'<div class="rpbig"><b>'+(info?info.time:'…')+'</b><span>'+(info?info.dist:t('building'))+'</span></div>'
    +'<button class="rpx" onclick="closeRoute()">✕</button></div>'
    +'<div class="rpmodes">'
    +'<button class="rpm'+(routeMode==='auto'?' on':'')+'" onclick="routeTo(\''+s.id+'\',\'auto\')">🚗 '+t('byCar')+'</button>'
    +'<button class="rpm'+(routeMode==='pedestrian'?' on':'')+'" onclick="routeTo(\''+s.id+'\',\'pedestrian\')">🚶 '+t('onFoot')+'</button></div>'
    +'<a class="rpnav" target="_blank" href="https://yandex.uz/maps/?rtext='+mePos.lat+','+mePos.lng+'~'+s.lat+','+s.lng+'&rtt='+(routeMode==='pedestrian'?'pd':'auto')+'">'+t('openNav')+'</a>';
  document.documentElement.style.setProperty('--rph',el.offsetHeight+'px');
}
const SNAP=[96,300,window.innerHeight*0.78]; let snapIdx=0;
function setSnap(i){snapIdx=Math.max(0,Math.min(2,i));const h=SNAP[snapIdx];
  document.getElementById('sheet').style.height=h+'px';
  document.documentElement.style.setProperty('--peek',h+'px');
  setTimeout(()=>{if(ymap)ymap.container.fitToViewport()},300)}
document.getElementById('shead').onclick=()=>setSnap(snapIdx===2?0:snapIdx+1);
(function(){const g=document.getElementById('grab');let y0=0,h0=0,drag=false;
  const start=e=>{drag=true;y0=(e.touches?e.touches[0]:e).clientY;h0=document.getElementById('sheet').offsetHeight;document.getElementById('sheet').style.transition='none'};
  const move=e=>{if(!drag)return;e.preventDefault();const y=(e.touches?e.touches[0]:e).clientY;
    const h=Math.max(96,Math.min(window.innerHeight*0.85,h0+(y0-y)));
    document.getElementById('sheet').style.height=h+'px';document.documentElement.style.setProperty('--peek',h+'px')};
  const end=()=>{if(!drag)return;drag=false;document.getElementById('sheet').style.transition='';
    const h=document.getElementById('sheet').offsetHeight;let best=0,bd=1e9;
    SNAP.forEach((s,i)=>{if(Math.abs(s-h)<bd){bd=Math.abs(s-h);best=i}});setSnap(best)};
  g.addEventListener('touchstart',start,{passive:true});g.addEventListener('touchmove',move,{passive:false});
  g.addEventListener('touchend',end);g.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);window.addEventListener('mouseup',end)})();
function buildUI(){
  document.getElementById('q').placeholder=t('ph');
  document.getElementById('stitle').textContent=t('near');
  document.getElementById('lang').textContent=lang==='ru'?'UZ':'RU';
  document.documentElement.lang=lang;
  const fs=['all','free','paid','ev','allowed'];
  document.getElementById('chips').innerHTML=fs.map(k=>'<button class="chip'+(filter===k?' on':'')+'" data-f="'+k+'">'+t(k)+'</button>').join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;buildUI();render()});
}
document.getElementById('lang').onclick=()=>{lang=lang==='ru'?'uz':'ru';localStorage.setItem('pl-lang',lang);buildUI();render();closeMask()};
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});
setSnap(0); buildUI(); render(); loadYandex();
window.addEventListener('resize',()=>{SNAP[2]=window.innerHeight*0.78});
</script>
</body>
</html>
