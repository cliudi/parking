<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://api-maps.yandex.ru" crossorigin>
<link rel="preconnect" href="https://core-renderer-tiles.maps.yandex.net" crossorigin>
<link rel="dns-prefetch" href="https://api-maps.yandex.ru">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parkly">
<meta name="mobile-web-app-capable" content="yes">
<title>Parkly — парковки Ташкента</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{
    /* ── фирменная палитра (дизайн 3) ── */
    --blue:#2563EB;   --blue-d:#1D4ED8;   /* платная */
    --green:#16A34A;  --green-d:#128A3E;  /* бесплатная */
    --amber:#FBBF24;  --amber-d:#E8AC0F;  /* зарядка EV */
    --red:#EF4444;    --red-d:#DC2626;    /* недоступно/закрыто */
    --grey:#9CA3AF;                       /* неизвестно */
    --violet:#7A5CFF;

    /* ── тема: светлая (по умолчанию) ── */
    --ink:#0F172A; --ink2:#6B7688; --bg:#F8FAFC; --card:#FFFFFF; --line:#E2E8F0;
    --sh-s:0 2px 8px rgba(15,23,42,.08); --sh:0 6px 20px rgba(15,23,42,.12); --sh-l:0 -6px 24px rgba(15,23,42,.10);
    --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
    --nav:60px;
  }
  html[data-theme="dark"]{
    --ink:#F1F5F9; --ink2:#94A3B8; --bg:#0B1220; --card:#141C2E; --line:#22304A;
    --sh-s:0 2px 10px rgba(0,0,0,.35); --sh:0 8px 26px rgba(0,0,0,.5); --sh-l:0 -8px 26px rgba(0,0,0,.4);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Manrope',sans-serif;color:var(--ink);background:var(--bg)}
  button{font-family:inherit}
  .hidden{display:none!important}

  /* ─────────── КАРТА (экран) ─────────── */
  #screen-map{position:fixed;inset:0}
  #map{position:absolute;inset:0;z-index:1;background:#E8EDF0}
  .osm-credit{position:absolute;left:7px;bottom:72px;z-index:5;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.88);color:#475467;font:600 9px Manrope;text-decoration:none;box-shadow:0 1px 4px rgba(15,23,42,.12)}
  html[data-theme="dark"] #map{background:#0B1220}
  html[data-theme="dark"] #map [class*="ground-pane"]{
    filter:invert(91%) hue-rotate(180deg) brightness(.78) contrast(1.08) saturate(.72);
  }
  html[data-theme="dark"] #map [class*="copyright"],
  html[data-theme="dark"] #map [class*="controls-pane"]{filter:none}

  html[data-theme="dark"] .sfab:not(.live):not(.on),
  html[data-theme="dark"] .zoomcol{background:#141C2E;border-color:#334155}
  html[data-theme="dark"] .sfab:not(.live):not(.on){color:#E2E8F0}
  html[data-theme="dark"] .compassneedle path:last-child{fill:#64748B}

  .topwrap{position:fixed;top:calc(10px + var(--top));left:12px;right:12px;z-index:60}
  .searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;box-shadow:var(--sh)}
  .searchbar .si{color:var(--ink2);font-size:17px}
  .searchbar input{flex:1;border:0;outline:none;background:none;font:600 14.5px 'Manrope';color:var(--ink);min-width:0}
  .searchbar input::placeholder{color:var(--ink2)}
  .bell{width:26px;height:26px;border-radius:50%;background:var(--bg);border:0;position:relative;font-size:14px;cursor:pointer;flex-shrink:0}
  .bell .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid var(--card)}

  .qchips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:1px}
  .qchips::-webkit-scrollbar{display:none}
  .qchip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;
    background:var(--card);border:0;font:700 13px 'Manrope';color:var(--ink);box-shadow:var(--sh-s);cursor:pointer;white-space:nowrap}
  .qchip.on{background:var(--blue);color:#fff}
  .qchip.on .qi{filter:brightness(3)}

  .sidefabs{position:absolute;right:12px;z-index:55;display:flex;flex-direction:column;gap:10px;
    top:50%;transform:translateY(-60%)}
  .sfab{width:46px;height:46px;border-radius:14px;background:var(--card);backdrop-filter:none;
    border:1px solid var(--line);box-shadow:var(--sh);
    font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .sfab:active{transform:scale(.93)}
  .sfab.on{background:var(--blue);color:#fff;border-color:transparent}
  .sfab.live{background:var(--green);color:#fff;border-color:transparent}
  .navarrow{width:16px;height:16px;transition:transform .15s}
  .compassneedle{width:20px;height:20px;transition:transform .12s linear}
  .accbadge{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:5px 8px;
    font:800 10px 'Manrope';color:var(--ink2);text-align:center;display:none;white-space:nowrap}
  .accbadge.on{display:block}
  .accbadge.good{color:var(--green)}
  .accbadge.bad{color:var(--amber)}
  .zoomcol{display:flex;flex-direction:column;background:var(--card);backdrop-filter:none;
    border-radius:14px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--line)}
  .zoomcol button{width:46px;height:44px;border:0;background:none;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
  .zoomcol button:first-child{border-bottom:1px solid var(--line)}

  .legendbtn{position:absolute;left:12px;z-index:55;top:50%;transform:translateY(120%);
    width:42px;height:42px;border-radius:12px;background:var(--card);border:0;box-shadow:var(--sh);
    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  /* нижняя мини-карточка */
  #minicard{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--bot));z-index:58;
    background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px 16px;display:none}
  #minicard.on{display:block;animation:slideUp .28s cubic-bezier(.2,.8,.3,1)}
  #routepanel{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--bot));z-index:59;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px 16px}
  .route-head{display:flex;align-items:center;gap:11px}.route-summary{flex:1;min-width:0}.route-summary b{font:700 14px Manrope;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .route-summary span,.route-progress{font:600 12px Manrope;color:var(--ink2)}.route-metrics{text-align:right}.route-metrics b{font:800 17px Manrope;color:var(--blue);display:block}.route-metrics span{font:700 11px Manrope;color:var(--ink2)}
  .route-close{width:34px;height:34px;border-radius:11px;background:var(--bg);border:0;font-size:15px;cursor:pointer}.route-modes,.route-actions,.route-alts{display:flex;gap:7px;margin-top:10px}
  .route-mode,.route-action,.route-alt{flex:1;padding:9px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 12px Manrope;cursor:pointer}
  .route-mode.on,.route-alt.on{border-color:var(--ink);background:var(--ink);color:#fff}.route-action.primary{background:var(--blue);border-color:var(--blue);color:#fff}.route-action.stop{background:#EF4444;border-color:#EF4444;color:#fff}
  .route-action:disabled{opacity:.55;cursor:wait}.route-attribution{margin-top:7px;text-align:right;font:600 9px Manrope;color:var(--ink2)}
  .route-progress{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  #routeBetaScreen{position:fixed;inset:0;z-index:120;background:#e8edf0;display:none}
  #routeBetaScreen.on{display:block}
  #routeBetaMap{position:absolute;inset:0}
  .route-beta-head{position:absolute;left:12px;right:12px;top:calc(10px + var(--top));z-index:3;display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:var(--sh)}
  .route-beta-head button{width:38px;height:38px;border:0;border-radius:11px;background:var(--bg);color:var(--ink);font-size:18px}
  .route-beta-title{min-width:0;flex:1}.route-beta-title small{display:block;color:var(--blue);font:800 9px Manrope;text-transform:uppercase}.route-beta-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:800 14px Manrope}
  #routeBetaPanel{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--bot));z-index:3;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px 16px}
  .route-provider-list{display:grid;gap:9px;margin-top:14px}.route-provider{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:left;font:700 13px Manrope}.route-provider strong{display:block}.route-provider small{display:block;margin-top:2px;color:var(--ink2);font:600 10px Manrope}.route-provider .provider-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--bg);font-size:19px}.route-provider.beta{border-color:#93b4ff;background:#eff6ff}.route-choice-check{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink2);font:650 11px Manrope}
  .route-beta-marker{width:30px;height:30px;border:4px solid #fff;border-radius:50%;box-shadow:0 3px 12px rgba(15,23,42,.3)}
  .route-beta-marker.start{background:#2563eb}.route-beta-marker.end{background:#16a34a;border-radius:50% 50% 50% 4px;transform:rotate(-45deg)}
  @media(min-width:760px){#routeBetaPanel{max-width:520px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%)}.route-beta-head{max-width:620px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%)}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .mc-head{display:flex;align-items:flex-start;gap:12px}
  .mc-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
  .mc-body{flex:1;min-width:0}
  .mc-body h3{font:700 15px 'Manrope';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-sub{font:600 12.5px 'Manrope';color:var(--ink2);margin-top:2px}
  .mc-meta{display:flex;align-items:center;gap:5px;font:700 12px 'Manrope';margin-top:5px}
  .mc-dist{font:800 13px 'Manrope';color:var(--blue);white-space:nowrap;display:flex;align-items:center;gap:3px}
  .mc-btn{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--blue);color:#fff;border:0;font:800 14px 'Manrope';cursor:pointer}
  .mc-btn:active{background:var(--blue-d)}
  .mc-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;margin-top:13px}
  .mc-actions .mc-btn{margin:0;min-width:0;padding:11px 9px;white-space:nowrap}
  .mc-btn.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .mc-btn.icon{padding:0;font-size:17px}.mc-kicker{font:800 10px Manrope;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .mc-place-details{margin-top:10px;padding:10px 12px;border-radius:13px;background:var(--bg);font:600 11.5px Manrope;color:var(--ink2);line-height:1.45}
  .mc-place-card{overflow:hidden}
  .mc-place-hero{display:flex;align-items:center;gap:12px;margin:-2px -2px 0;padding:13px;border-radius:16px;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 58%,#0f766e 100%);color:#fff}
  .mc-place-hero.parking{background:linear-gradient(135deg,#16a34a 0%,#059669 58%,#047857 100%)}
  .mc-place-hero.ev{background:linear-gradient(135deg,#f59e0b 0%,#ea580c 58%,#c2410c 100%)}
  .mc-place-hero.position{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 62%,#4338ca 100%)}
  .mc-place-hero .mc-ic{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.18)!important;border:1px solid rgba(255,255,255,.25);font-size:23px}
  .mc-place-hero .mc-kicker,.mc-place-hero .mc-sub{color:rgba(255,255,255,.78)}
  .mc-place-hero h3{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .mc-place-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
  .mc-place-fact{padding:10px 11px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
  .mc-place-fact small{display:block;font:700 9px Manrope;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
  .mc-place-fact b{display:block;font:750 11.5px Manrope;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-place-note{margin-top:9px;font:600 10.5px Manrope;color:var(--ink2);line-height:1.4}
  .parking-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .parking-badge{display:inline-flex;align-items:center;min-height:25px;padding:4px 9px;border-radius:999px;
    background:var(--soft);border:1px solid var(--line);color:var(--ink);font:700 10.5px Manrope;line-height:1.2}
  .parking-badge.primary{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
  .parking-badge.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
  [data-theme="dark"] .parking-badge.primary{background:#172554;border-color:#1E40AF;color:#BFDBFE}
  [data-theme="dark"] .parking-badge.warn{background:#422006;border-color:#854D0E;color:#FDE68A}
  .parking-terms{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
  .parking-terms h3{margin:0 0 8px;font:800 13px Manrope}
  .parking-term-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font:600 12px Manrope}
  .parking-term-row:first-of-type{border-top:0}.parking-term-row span{color:var(--ink2)}
  .parking-term-note{margin-top:7px;color:var(--ink2);font:600 11px/1.45 Manrope;overflow-wrap:anywhere}
  .fav-access{display:flex!important;flex-wrap:wrap;gap:4px;margin-top:4px}
  .fav-access .parking-badge{min-height:20px;padding:2px 6px;font-size:9.5px}
  .mc-dismiss{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:11px;background:var(--bg);color:var(--ink2);font-size:15px;cursor:pointer}
  .mc-main-actions{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:12px}.mc-main-actions .mc-btn{margin:0;padding:11px 8px}
  .mc-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.mc-tools .mc-btn{margin:0;padding:9px 6px;min-height:40px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:12px}

  /* ─────────── НИЖНЯЯ НАВИГАЦИЯ ─────────── */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:65;height:calc(var(--nav) + var(--bot));
    padding-bottom:var(--bot);background:var(--card);border-top:1px solid var(--line);
    display:flex;align-items:stretch}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:none;cursor:pointer;color:var(--ink2);position:relative}
  .navitem .ni{font-size:19px;line-height:1}
  .navitem span{font:700 10px 'Manrope'}
  .navitem.on{color:var(--blue)}
  .navadd{transform:translateY(-2px)}
  .navadd .ni{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(37,99,235,.4)}
  .navadd span{color:var(--blue)}

  /* ─────────── ЛИСТЫ (Избранное, Профиль, полная карточка) ─────────── */
  .screen{position:fixed;inset:0;bottom:calc(var(--nav) + var(--bot));z-index:40;background:var(--bg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-top:var(--top)}
  .screen.on{display:block}
  .scr-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;z-index:2}
  .scr-head h1{font:800 19px 'Manrope'}
  .scr-head .act{font:700 14px 'Manrope';color:var(--blue);border:0;background:none;cursor:pointer}

  /* ─────────── МОДАЛКИ (bottom sheet) ─────────── */
  .mask{position:fixed;inset:0;background:rgba(18,32,46,.5);z-index:200;display:none;align-items:flex-end}
  .mask.open{display:flex}
  .sheet{position:relative;background:var(--card);width:100%;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;
    animation:up .28s cubic-bezier(.2,.8,.3,1);padding-bottom:calc(20px + var(--bot))}
  @keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .grabber{padding:10px 0 4px;display:flex;justify-content:center;position:sticky;top:0}
  .grabber i{width:42px;height:5px;border-radius:3px;background:var(--line)}

  /* полная карточка */
  .fc-photo{position:relative;height:210px;background:#DCE3E8 center/cover;margin:-4px -0 0}
  .fc-photo .navbtns{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:flex-end;z-index:3}
  .fc-photo .rbtns{display:flex;gap:8px}
  .cbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);border:1px solid rgba(15,23,42,.08);font-size:22px;line-height:1;color:#0F172A;
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(15,23,42,.18);backdrop-filter:blur(8px)}
  html[data-theme="dark"] .cbtn{background:rgba(15,23,42,.88);border-color:rgba(255,255,255,.12);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.42)}
  .sheet-close{position:absolute;top:12px;right:14px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(15,23,42,.10);background:rgba(255,255,255,.96);color:#0F172A;font:500 25px/1 Manrope;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 18px rgba(15,23,42,.16);cursor:pointer}
  .sheet-close:active{transform:scale(.94)}
  html[data-theme="dark"] .sheet-close{background:rgba(15,23,42,.94);border-color:rgba(255,255,255,.14);color:#F8FAFC;box-shadow:0 6px 18px rgba(0,0,0,.48)}
  .cbtn.fav.on{color:var(--red)}
  .fc-body{padding:16px 18px 0}
  .fc-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .fc-title h2{font:800 20px 'Manrope';line-height:1.2}
  .rating{display:flex;align-items:center;gap:3px;background:#E9F7EE;color:var(--green);
    padding:4px 8px;border-radius:8px;font:800 12px 'Manrope';flex-shrink:0}
  .fc-addr{display:flex;align-items:center;gap:6px;font:600 13px 'Manrope';color:var(--ink2);margin-top:8px}
  .fc-status{display:flex;align-items:center;gap:6px;font:700 13px 'Manrope';margin-top:6px}
  .fc-status .dist{color:var(--blue);margin-left:auto}
  .fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .fc-cell{background:var(--bg);border-radius:14px;padding:13px 14px}
  .fc-cell .lbl{font:700 10.5px 'Manrope';color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
  .fc-cell .val{font:800 16px 'Manrope';margin-top:4px}
  .fc-cell .val.sm{font-size:13.5px}
  .fc-cell .val.free{color:var(--green)}
  .fc-cell .val.ev{color:var(--violet)}
  .legalnote{background:#FEF6E7;border:1px solid #F6E2B8;border-radius:12px;padding:11px 13px;
    font:600 12px 'Manrope';color:#8A6D1F;line-height:1.5;margin-bottom:14px;display:flex;gap:8px}
  .verify{font:600 12px 'Manrope';color:var(--ink2);margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .fc-actions{display:flex;flex-direction:column;gap:9px}
  .btn-primary{width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;border:0;
    font:800 15px 'Manrope';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary:active{background:var(--blue-d)}
  .btn-outline{width:100%;padding:14px;border-radius:14px;background:var(--card);color:var(--blue);
    border:1.5px solid var(--line);font:800 14px 'Manrope';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-outline.fav-active{background:#EFF6FF;border-color:#93C5FD;color:var(--blue-d)}
  html[data-theme="dark"] .btn-outline.fav-active{background:rgba(37,99,235,.16);border-color:rgba(96,165,250,.55);color:#93C5FD}
  .btn-report{width:100%;padding:12px;border-radius:12px;background:none;color:var(--ink2);border:0;
    font:700 13px 'Manrope';cursor:pointer;margin-top:2px}

  /* фильтры */
  .filt-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px}
  .filt-head h2{font:800 18px 'Manrope'}
  .filt-head .x{width:32px;height:32px;border-radius:50%;background:var(--bg);border:0;font-size:15px;cursor:pointer}
  .filt-body{padding:0 18px}
  .filt-group{margin-bottom:20px}
  .filt-group h3{font:700 13px 'Manrope';color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
  .radio-row,.check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .radio-row:last-child,.check-row:last-child{border:0}
  .radio-row .ri{width:26px;text-align:center;font-size:16px}
  .radio-row .rl{flex:1;font:700 14.5px 'Manrope'}
  .radio-mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
  .radio-row.sel .radio-mark{border-color:var(--blue)}
  .radio-row.sel .radio-mark::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
  .toggle{width:44px;height:26px;border-radius:13px;background:var(--line);flex-shrink:0;position:relative;transition:.2s;cursor:pointer}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--sh-s)}
  .toggle.on{background:var(--blue)}
  .toggle.on::after{left:21px}
  .price-row{display:flex;justify-content:space-between;font:700 13px 'Manrope';color:var(--ink2);margin-bottom:8px}
  .slider{width:100%}
  .filt-foot{padding:14px 18px calc(14px + var(--bot));display:flex;flex-direction:column;gap:9px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
  .btn-ghost{width:100%;padding:13px;border-radius:12px;background:none;color:var(--ink2);border:0;font:700 14px 'Manrope';cursor:pointer}

  /* добавление / отчёт формы */
  .form-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px;position:sticky;top:0;background:var(--card);z-index:2}
  .form-head .fh-side{font:700 14px 'Manrope';color:var(--blue);border:0;background:none;cursor:pointer;min-width:60px;text-align:left}
  .form-head .fh-side.right{text-align:right}
  .form-head h2{font:800 16px 'Manrope'}
  .form-body{padding:0 18px}
  .field{margin-bottom:14px}
  .field label{font:700 11px 'Manrope';color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;
    font:600 14px 'Manrope';color:var(--ink);outline:none;background:var(--card);appearance:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
  .field textarea{resize:none;height:70px}
  .field .req{color:var(--red)}
  .field-row{display:flex;gap:10px}.field-row .field{flex:1}
  .photo-add{display:flex;gap:8px;margin-top:4px}
  .photo-slot{width:70px;height:70px;border-radius:12px;border:1.5px dashed var(--line);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 9px 'Manrope';color:var(--ink2);cursor:pointer;flex-shrink:0}
  .photo-thumb{width:70px;height:70px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--line)}

  /* избранное список */
  .fav-list{padding:12px}
  .fav-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--sh-s);cursor:pointer}
  .fav-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0}
  .fav-txt{flex:1;min-width:0}
  .fav-txt b{font:700 14.5px 'Manrope';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav-txt span{font:600 12px 'Manrope';color:var(--ink2)}
  .fav-right{text-align:right;flex-shrink:0}
  .fav-dist{font:800 12.5px 'Manrope';color:var(--blue)}
  .fav-more{font-size:18px;color:var(--grey);padding:4px}
  .submission-card .fav-txt{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
  .submission-card .fav-txt b{width:100%}
  .submission-address{display:block!important;width:100%;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
  .submission-status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font:800 11px 'Manrope';line-height:1.2}
  .submission-status.pending,.submission-status.needs-info{color:#92400E;background:#FEF3C7}
  .submission-status.approved{color:#166534;background:#DCFCE7}
  .submission-status.rejected{color:#991B1B;background:#FEE2E2}
  .submission-note{display:block!important;width:100%;margin-top:1px;line-height:1.45}
  .info-list{display:flex;flex-direction:column;gap:10px}
  .info-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  .info-card b{display:block;font:800 14px 'Manrope';margin-bottom:5px}
  .info-card span{display:block;font:600 12.5px 'Manrope';color:var(--ink2);line-height:1.55}

  /* профиль */
  .prof-card{background:var(--card);margin:12px;border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-s)}
  .prof-ava{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:800 22px 'Manrope';flex-shrink:0}
  .prof-info b{font:800 17px 'Manrope';display:block}
  .prof-info span{font:600 13px 'Manrope';color:var(--ink2)}
  .prof-list{background:var(--card);margin:0 12px 12px;border-radius:18px;overflow:hidden;box-shadow:var(--sh-s)}
  .prof-row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .prof-row:last-child{border:0}
  .prof-row .pri{width:26px;text-align:center;font-size:17px}
  .prof-row .prl{flex:1;font:700 14.5px 'Manrope'}
  .prof-row .prv{font:700 13px 'Manrope';color:var(--ink2)}
  .prof-row .arr{color:var(--grey);font-size:15px}
  .prof-logout{width:calc(100% - 24px);margin:0 12px;padding:15px;border-radius:16px;background:var(--card);
    color:var(--red);border:0;font:800 15px 'Manrope';cursor:pointer;box-shadow:var(--sh-s)}
  .empty-state{padding:60px 30px;text-align:center}
  .empty-state .ei{font-size:44px;margin-bottom:14px}
  .empty-state b{font:800 16px 'Manrope';display:block;margin-bottom:6px}
  .empty-state span{font:600 13.5px 'Manrope';color:var(--ink2);line-height:1.5}

  /* легенда */
  .legend-body{padding:4px 18px 8px}
  .legend-item{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
  .legend-item:last-child{border:0}
  .legend-mark{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .legend-item b{font:700 14px 'Manrope';display:block}
  .legend-item span{font:600 12px 'Manrope';color:var(--ink2)}

  /* маркеры на карте — фирменные пины дизайн 3 */
  .marker{position:relative;width:38px;height:46px;cursor:pointer;filter:drop-shadow(0 4px 7px rgba(15,23,42,.26))}
  .marker .pin{position:absolute;left:2px;top:1px;width:34px;height:34px;border-radius:50% 50% 50% 7px;
    transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;
    background:var(--pin-color,#9CA3AF);box-shadow:0 1px 2px rgba(15,23,42,.18)}
  .marker .pin b{transform:rotate(-45deg);color:#fff;font:800 15px 'Manrope';line-height:1}
  .marker.selected{transform:scale(1.14);transform-origin:50% 80%;z-index:20}
  .marker .bolt{position:absolute;top:-2px;right:-1px;width:18px;height:18px;border-radius:50%;background:var(--amber);
    color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:800 10px 'Manrope';z-index:3}
  .marker.ev-only .pin b{font-size:17px}
  .me-wrap{position:relative;width:22px;height:22px}
  .me-dot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    background:var(--blue);border:3px solid #fff;box-sizing:border-box;
    box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:3}
  .me-dot.rough{background:var(--amber)}
  .me-pulse{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:rgba(37,99,235,.40);animation:mePulse 2.2s ease-out infinite;z-index:1}
  .me-dot.rough ~ .me-pulse,.me-pulse.rough{background:rgba(245,166,35,.40)}
  @keyframes mePulse{0%{transform:scale(1);opacity:.65}70%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}
  .me-cone{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;z-index:2;
    clip-path:polygon(50% 50%, 26% 0%, 74% 0%);
    background:linear-gradient(to top, rgba(37,99,235,0), rgba(37,99,235,.55));
    transform-origin:50% 50%;transition:transform .18s linear}

  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);z-index:400;
    bottom:calc(var(--nav) + 80px + var(--bot));background:var(--ink);color:#fff;font:700 13px 'Manrope';
    padding:13px 20px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;box-shadow:var(--sh)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #maperr{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--bg)}

/* ═══════════ UI/UX ОБНОВЛЕНИЕ PARKLY — безопасные CSS-переопределения ═══════════ */
:root{
  --radius-xs:10px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --tap:48px;
  --content-max:760px;
}
body{font-size:16px}
button,input,select,textarea{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(37,99,235,.22);
  outline-offset:2px;
}
button:disabled{opacity:.55;cursor:not-allowed}

/* Верхняя область: визуальная иерархия, безопасные зоны и удобный поиск */
.topwrap{
  top:calc(12px + var(--top));
  left:max(12px,env(safe-area-inset-left));
  right:max(12px,env(safe-area-inset-right));
}
.searchbar{
  min-height:54px;
  padding:8px 9px 8px 15px;
  border:1px solid rgba(226,232,240,.92);
  border-radius:18px;
  box-shadow:0 8px 28px rgba(15,23,42,.13);
}
html[data-theme="dark"] .searchbar{border-color:#2B3B56}
.searchbar .si{font-size:18px}
.searchbar input{font-size:15px;line-height:1.4}
.bell{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:12px;
  font-size:16px!important;
}
.bell:active{transform:scale(.95)}
.qchips{gap:7px;margin-top:9px;padding:2px 1px 5px}
.qchip{
  min-height:40px;
  padding:8px 14px;
  border:1px solid var(--line);
  box-shadow:0 2px 9px rgba(15,23,42,.08);
}
.qchip.on{border-color:transparent;box-shadow:0 5px 14px rgba(37,99,235,.26)}

/* Управление картой: единый размер и большая зона касания */
.sidefabs{
  right:max(12px,env(safe-area-inset-right));
  gap:9px;
  transform:translateY(-54%);
}
.sfab,.zoomcol button{width:var(--tap);height:var(--tap)}
.sfab,.zoomcol,.legendbtn{
  border:1px solid var(--line);
  box-shadow:0 5px 18px rgba(15,23,42,.13);
}
.sfab{border-radius:15px}
.zoomcol{border-radius:15px}
.zoomcol button{font-size:22px}
.legendbtn{
  left:max(12px,env(safe-area-inset-left));
  width:46px;height:46px;border-radius:14px;
}

/* Мини-карточка: сначала важные данные, затем одно понятное действие */
#minicard{
  left:max(12px,env(safe-area-inset-left));
  right:max(12px,env(safe-area-inset-right));
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  box-shadow:0 13px 38px rgba(15,23,42,.18);
}
.mc-ic{width:48px;height:48px;border-radius:14px}
.mc-body h3{font-size:15.5px;line-height:1.35}
.mc-sub{line-height:1.45}
.mc-meta{flex-wrap:wrap;line-height:1.4}
.mc-btn{min-height:48px;border-radius:14px;font-size:14.5px}

/* Нижняя навигация: минимум 48 px на действие, более читаемые подписи */
.bottomnav{
  min-height:calc(66px + var(--bot));
  height:calc(66px + var(--bot));
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  box-shadow:0 -5px 20px rgba(15,23,42,.07);
}
.navitem{min-width:64px;gap:4px}
.navitem .ni{font-size:21px}
.navitem span{font-size:10.5px}
.navitem.on::after{
  content:'';
  position:absolute;
  top:0;
  width:28px;height:3px;
  border-radius:0 0 4px 4px;
  background:var(--blue);
}
.navadd{transform:translateY(-4px)}
.navadd::after{display:none}
.navadd .ni{width:46px;height:46px}

/* Полноэкранные разделы */
.screen{bottom:calc(66px + var(--bot))}
.scr-head{
  min-height:62px;
  padding:14px max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));
  box-shadow:0 2px 10px rgba(15,23,42,.04);
}
.scr-head h1{font-size:20px}

/* Bottom sheets: удобные отступы, фиксируемая зона действий */
.mask{background:rgba(15,23,42,.58)}
.sheet{
  border-radius:26px 26px 0 0;
  max-height:94vh;
  overscroll-behavior:contain;
  box-shadow:0 -18px 55px rgba(15,23,42,.22);
}
.grabber{padding:9px 0 6px;background:var(--card);z-index:5}
.grabber i{width:46px;height:5px}

/* Полная карточка парковки */
.fc-photo{height:220px;background-color:#DCE3E8}
.fc-body{padding:18px 18px 4px}
.fc-title h2{font-size:21px;line-height:1.28}
.fc-addr{line-height:1.5}
.fc-status{line-height:1.45}
.fc-grid{gap:11px;margin:18px 0}
.fc-cell{
  min-height:76px;
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 14px;
}
.fc-cell .lbl{font-size:10px}
.fc-cell .val{line-height:1.3}
.legalnote{border-radius:14px;line-height:1.55}
.fc-actions{padding-bottom:8px}
.btn-primary,.btn-outline{min-height:50px;border-radius:15px}
.btn-report{min-height:44px}
.sheet-close,.cbtn{width:44px;height:44px}

/* Фильтры: четкие группы и улучшенные строки выбора */
.filt-head{padding:8px 18px 14px}
.filt-head h2{font-size:20px}
.filt-head .x{width:40px;height:40px;font-size:18px}
.filt-body{padding:0 18px 8px}
.filt-group{
  padding:14px 14px 5px;
  border:1px solid var(--line);
  border-radius:16px;
  margin-bottom:14px;
}
.radio-row,.check-row{min-height:50px}
.radio-mark{width:23px;height:23px}
.toggle{width:48px;height:28px;border-radius:14px}
.toggle::after{width:22px;height:22px}
.toggle.on::after{left:23px}
.filt-foot{gap:10px;padding-top:12px}

/* Формы: лейблы без излишнего верхнего регистра, хорошие состояния фокуса */
.form-head{min-height:58px;padding:8px 18px 14px}
.form-head h2{font-size:18px}
.form-body{padding:0 18px 6px}
.field{margin-bottom:16px}
.field label{
  font-size:12.5px;
  text-transform:none;
  letter-spacing:0;
  margin-bottom:7px;
  color:var(--ink);
}
.field input,.field select,.field textarea{
  min-height:48px;
  padding:12px 13px;
  border-width:1px;
  border-radius:13px;
  font-size:14.5px;
}
.field textarea{min-height:88px;height:auto;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}
.photo-slot,.photo-thumb{width:78px;height:78px;border-radius:14px}

/* Избранное и профиль */
.fav-list{padding:14px 12px}
.fav-item{
  min-height:76px;
  border:1px solid var(--line);
  box-shadow:none;
  border-radius:17px;
}
.fav-item:active{transform:scale(.99)}
.prof-card,.prof-list,.prof-logout{border:1px solid var(--line);box-shadow:none}
.prof-row{min-height:56px}
.prof-row:active{background:var(--bg)}
.empty-state{max-width:460px;margin:auto}

/* Тост: не перекрывает нижнюю навигацию и хорошо читается */
#toast{
  bottom:calc(66px + 26px + var(--bot));
  border-radius:14px;
  line-height:1.45;
  padding:12px 17px;
}

/* Адаптация под маленькие экраны */
@media(max-width:380px){
  .topwrap{left:8px;right:8px}
  .searchbar{padding-left:12px}
  .qchip{padding-left:12px;padding-right:12px}
  .sidefabs{right:8px}
  .legendbtn{left:8px}
    #minicard{left:8px;right:8px}
    #routepanel{left:8px;right:8px;padding:12px}.route-head{gap:7px}.route-mode,.route-action,.route-alt{padding:8px 5px;font-size:11px}
  .fc-grid{grid-template-columns:1fr}
  .field-row{flex-direction:column;gap:0}
}
@media(min-width:768px){
  .sheet{max-width:680px;margin:0 auto}
  .mask{justify-content:center}
    #minicard{max-width:520px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%)}
    #routepanel{max-width:520px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%)}
  #minicard.on{animation:slideUpCentered .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes slideUpCentered{
    from{transform:translate(-50%,30px);opacity:0}
    to{transform:translate(-50%,0);opacity:1}
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>

<div id="screen-map">
  <div id="map"></div>

  <div id="maperr">
    <div style="font-size:40px;margin-bottom:12px">🗺️</div>
    <b id="maperr-t" style="font:800 16px Manrope"></b>
    <span id="maperr-p" style="font:600 13px Manrope;color:var(--ink2);margin-top:8px;line-height:1.5"></span>
  </div>

  <div class="topwrap">
    <div class="searchbar">
      <span class="si">🔍</span>
      <input id="search" aria-label="Поиск парковок и адресов" autocomplete="off">
      <button class="bell" id="themebtn" style="font-size:15px" aria-label="Переключить тему" title="Переключить тему">🌙</button>
      <button class="bell" id="notificationsBtn" aria-label="Уведомления" title="Уведомления" onclick="openNotifications()"><span class="dot" id="notificationsDot" style="display:none"></span>🔔</button>
    </div>

function loadAuthSession(){
  try{
    const session=JSON.parse(localStorage.getItem('parkly-auth')||'null');
    return session&&session.access_token&&session.user?session:null;
  }catch(e){return null}
}
let authSession=loadAuthSession();

function saveAuthSession(data){
  authSession=data?{
    access_token:data.access_token,
    refresh_token:data.refresh_token,
    expires_at:Date.now()+Math.max(60,Number(data.expires_in||3600))*1000-60000,
    user:data.user
  }:null;
  try{
    if(authSession)localStorage.setItem('parkly-auth',JSON.stringify(authSession));
    else localStorage.removeItem('parkly-auth');
  }catch(e){}
}
async function refreshAuthSession(){
  if(!authSession?.refresh_token)return null;
  try{
    const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
      body:JSON.stringify({refresh_token:authSession.refresh_token})
    });
    if(!res.ok)throw new Error('refresh '+res.status);
    const data=await res.json();saveAuthSession(data);return authSession.access_token;
  }catch(e){saveAuthSession(null);return null}
}
async function accessToken(){
  if(!authSession)return null;
  if(authSession.expires_at>Date.now())return authSession.access_token;
  return refreshAuthSession();
}
async function authAction(mode,email,password){
  const endpoint=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const res=await fetch(SUPABASE_URL+endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
    body:JSON.stringify({email,password})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.msg||data.message||data.error_description||'Ошибка авторизации');
  if(data.access_token)saveAuthSession(data);
  return data;
}
async function userRest(path,options={}){
  const token=await accessToken();
  if(!token)throw new Error('Сначала войдите в аккаунт');
  const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+token,...(options.headers||{})};
  if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const res=await fetch(SUPABASE_URL+path,{...options,headers});
  if(!res.ok){
    const detail=await res.text().catch(()=>'');
    throw new Error('Supabase '+res.status+' '+detail);
  }
  if(res.status===204)return null;
  const text=await res.text();return text?JSON.parse(text):null;
}

function clientId(){
  const key='parkly-client-id';
  let id='';
  try{id=localStorage.getItem(key)||''}catch(e){}
  if(!/^[0-9a-f-]{36}$/i.test(id)){
    id=(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0;
      return(c==='x'?r:(r&3|8)).toString(16)
    }));
    try{localStorage.setItem(key,id)}catch(e){}
  }
  return id;
}
async function supabaseRpc(name,payload){
  const token=await accessToken();
  const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY)},
    body:JSON.stringify(payload)
  });
  if(!res.ok){
    const detail=await res.text().catch(()=>'');
    throw new Error('rpc '+name+' '+res.status+' '+detail);
  }
  const text=await res.text();
  return text?JSON.parse(text):null;
}

// Преобразуем строку из базы в формат, который уже понимает приложение
function fromDbRow(r){
  return {
    id: String(r.id), name: cleanText(r.name)||'Парковка', addr: cleanText(r.address),
    lat: Number(r.lat_out), lng: Number(r.lng_out),

    price_type: r.price_type,
    price_val: r.price_hour||0,

    price_day: r.price_day ? Number(r.price_day).toLocaleString('ru')+' сум/сутки' : null,
    cap: r.capacity, cap_est: !!r.capacity_est,
    hours: cleanText(r.hours)||'—', is247: !!r.is_247,
    ptype: r.kind||'open', height: r.height_limit ? Number(r.height_limit)+' м' : null,
    ev: !!r.has_ev, ev_details: (r.ev_connectors||[]).map(cleanText).join(', ')||null,
    cctv: !!r.has_cctv, disabled: !!r.has_disabled, wash: !!r.has_wash,
    payment: (r.payment_methods||[]).map(cleanText).join(', ')||'—', rating: null,
    photo: safePhotoUrl(r.photos&&r.photos[0]),
    verified: cleanText(r.verified_at), source: r.source==='OSM'?'OpenStreetMap':(r.source==='ADMIN'?'Команда Parkly':cleanText(r.source)||'Источник не указан'),
    legal: r.category==='STREET_ALLOWED',
    has_barrier: !!r.has_barrier,
    barrier_at_entry: !!r.barrier_at_entry,
    barrier_at_exit: !!r.barrier_at_exit,
    requires_ticket: !!r.requires_ticket,
    entry_rules: cleanText(r.entry_rules),
    exit_rules: cleanText(r.exit_rules),
    has_free_period: !!r.has_free_period,
    free_period_minutes: r.free_period_minutes==null?null:Number(r.free_period_minutes),
    price_after_free_period: r.price_after_free_period==null?null:Number(r.price_after_free_period),
    price_after_free_period_unit: cleanText(r.price_after_free_period_unit)||'unknown',
    requires_purchase: !!r.requires_purchase,
    requires_receipt: !!r.requires_receipt,

async function loadParkingAccess(rows,signal){
  const ids=(rows||[]).map(row=>String(row.id)).filter(Boolean);
  if(!ids.length)return new Map();
  const select='id,has_barrier,barrier_at_entry,barrier_at_exit,requires_ticket,entry_rules,exit_rules,has_free_period,free_period_minutes,price_after_free_period,price_after_free_period_unit,requires_purchase,requires_receipt,tariff_note,tariff_verified_at,tariff_source_ref';
  const filter='in.('+ids.join(',')+')';
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/parkings?select='+encodeURIComponent(select)+'&id='+encodeURIComponent(filter),{
      signal,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    if(!res.ok)throw new Error('parking access http '+res.status);
    const data=await res.json();
    return new Map((Array.isArray(data)?data:[]).map(row=>[String(row.id),row]));
  }catch(error){
    if(error.name==='AbortError')throw error;
    console.warn('Условия доступа парковок временно недоступны:',error);
    return new Map();
  }
}

// Грузим парковки рядом с точкой (или центр Ташкента, если позиция ещё не известна).
// Повторный запрос отменяет предыдущий: это заметно ускоряет старт, когда GPS
// уточняет координаты сразу после первоначальной загрузки центра города.
let parkingLoadController=null;
let lastParkingLoadKey='';
let lastParkingLoadAt=0;
async function loadParkingsFromDB(lat, lng, radius){
  const body = {
    lat: lat||41.3111, lng: lng||69.2650,
    radius_m: radius||30000,
    only_free:false, only_ev:false, max_price:null, lim:500
  };
  const requestKey=[body.lat.toFixed(4),body.lng.toFixed(4),body.radius_m].join('|');
  if(requestKey===lastParkingLoadKey&&Date.now()-lastParkingLoadAt<8000)return true;
  if(parkingLoadController)parkingLoadController.abort();
  parkingLoadController=new AbortController();
  const controller=parkingLoadController;
  const timeout=setTimeout(()=>controller.abort(),12000);
  try{
    const parkingPromise=fetch(SUPABASE_URL+'/rest/v1/rpc/parkings_nearby',{
      method:'POST',signal:controller.signal,
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
      body:JSON.stringify(body)
    });
    const [res]=await Promise.all([parkingPromise,loadStreetSegments()]);
    if(!res.ok)throw new Error('db http '+res.status);
    const rows=await res.json();
    if(!Array.isArray(rows))throw new Error('db response');
    const accessById=await loadParkingAccess(rows,controller.signal);
    if(controller!==parkingLoadController)return false;
    PARKINGS=rows.map(row=>fromDbRow({...row,...(accessById.get(String(row.id))||{})})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));
    rememberFavoriteTermsChanges();
    lastParkingLoadKey=requestKey;lastParkingLoadAt=Date.now();
    lastMarkerSignature='';
    requestAnimationFrame(()=>{drawStreetSegments();drawMarkers(true)});
    if(activeTab==='fav')renderFav();
    return true;
  }catch(e){
    if(e.name==='AbortError'&&controller!==parkingLoadController)return false;
    console.warn('Supabase недоступен:',e);
    toast(t('networkErr'));
    return false;
  }finally{
    clearTimeout(timeout);
    if(controller===parkingLoadController)parkingLoadController=null;
  }
}

let streetSegments=[],streetLines=new Map(),streetSegmentIds=new Set();
async function loadStreetSegments(){
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/street_parking_segments',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:'{}'});
    if(!res.ok){streetSegments=[];streetSegmentIds=new Set();return}
    const rows=await res.json();
    streetSegments=(Array.isArray(rows)?rows:[]).filter(x=>Array.isArray(x.path)&&x.path.length>=2);
    streetSegmentIds=new Set(streetSegments.map(x=>String(x.parking_id)));
  }catch(e){console.warn('Уличные участки недоступны:',e)}
}
function drawStreetSegments(){
  if(!ymap||!window.ymaps)return;
  const wanted=new Set();
  streetSegments.forEach(segment=>{
    const key=String(segment.parking_id);wanted.add(key);
    const parking=PARKINGS.find(p=>String(p.id)===String(segment.parking_id));
    const color=parking?markerColor(parking):'#2563EB';
    const signature=color+'|'+JSON.stringify(segment.path),existing=streetLines.get(key);
    if(existing&&existing.signature===signature)return;
    if(existing)ymap.geoObjects.remove(existing.line);
    const line=new ymaps.Polyline(segment.path,{hintContent:parking?.name||'Разрешённая уличная парковка'},{strokeColor:color,strokeWidth:7,strokeOpacity:.86});
    line.events.add('click',()=>selectParking(String(segment.parking_id)));
    ymap.geoObjects.add(line);streetLines.set(key,{line,signature});
  });
  streetLines.forEach((entry,key)=>{if(!wanted.has(key)){ymap.geoObjects.remove(entry.line);streetLines.delete(key)}});
}

/* цвет/иконка маркера по типу (ПДД разд.7.3: зелёный=бесплатно, синий=платно, серый=неизвестно) */
/* Цвет по фирменной палитре (дизайн 3):
   синий=платная, зелёный=бесплатная, жёлтый=зарядка EV, красный=недоступно, серый=неизвестно */
function markerColor(p){
  if(p.closed) return '#EF4444';
  if(p.ev && p.price_type==='free') return '#16A34A';   // зелёный+жёлтый комбо рисуем отдельно

function dist(a,b,c,d){
  const R=6371,dl=(c-a)*Math.PI/180,dg=(d-b)*Math.PI/180;
  const h=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dg/2)**2;
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

}

/* Быстрые SVG-пины вместо тяжёлых HTML-макетов.
   По форме это аккуратная «капля», как в дизайн-референсе. */
const PIN_CACHE=new Map();
function buildSvgPinData(color,symbol,combo,selected){
  const key=[color,symbol,combo?'1':'0',selected?'1':'0',document.documentElement.getAttribute('data-theme')||'light'].join('|');
  if(PIN_CACHE.has(key))return PIN_CACHE.get(key);
  const scale=selected?1.08:1;
  const icon=symbol==='⚡'
    ? '<path d="M28.2 16.2h-5.1l2.1-7.2-8.3 10.7h5.2l-1.5 8.4z" fill="#fff"/>'
    : '<text x="27" y="27.3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17.5" font-weight="800" fill="#fff">P</text>';
  const badge=combo
    ? '<circle cx="39.5" cy="13.5" r="7.2" fill="#FBBF24" stroke="#fff" stroke-width="2.2"/><path d="M40.5 9.2l-4.2 5h3l-1 4.2 4.4-5.4h-3z" fill="#fff"/>'
    : '';
  const darkTheme=document.documentElement.getAttribute('data-theme')==='dark';
  const pinStroke=darkTheme?'#CBD5E1':'#FFFFFF';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="54" height="60" viewBox="0 0 54 60">
    <g transform="translate(27 28) scale(${scale}) translate(-27 -28)">
      <path d="M27 5C16.5 5 9 12.5 9 22.3c0 11.5 12.1 23.2 16.1 26.7a2.9 2.9 0 0 0 3.8 0C32.9 45.5 45 33.8 45 22.3 45 12.5 37.5 5 27 5Z" fill="${color}" stroke="${pinStroke}" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="27" cy="22" r="12.2" fill="${color}"/>
      ${icon}${badge}
    </g>
  </svg>`;
  const uri='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
  PIN_CACHE.set(key,uri);return uri;
}

const pinIconCache=new Map();
function svgPinData(color,symbol,combo,selected){
  const theme=document.documentElement.getAttribute('data-theme')||'light';
  const key=[theme,color,symbol,combo?1:0,selected?1:0].join('|');
  if(!pinIconCache.has(key))pinIconCache.set(key,buildSvgPinData(color,symbol,combo,selected));
  return pinIconCache.get(key);
}
function markerSizeByZoom(selected){
  const z=ymap?ymap.getZoom():13;

  if(z<12) size=[52,59];

  if(selected) size=[Math.round(size[0]*1.12),Math.round(size[1]*1.12)];
  return size;
}
function specialParkingMarker(p,selected){

  const family=p.has_free_period?PARKING_MARKER_ASSETS.freePeriod:PARKING_MARKER_ASSETS.barrier;
  const variant=selected?'selected':((ymap?ymap.getZoom():13)<13?'small':'normal');
  /* Все семейства меток используют одну шкалу размеров. Раньше специальные
     PNG-метки были заметно меньше обычных SVG-меток на том же масштабе. */
  const size=markerSizeByZoom(selected);

}

function markerLimitByZoom(z){
  if(z<12)return 2;
  if(z<13)return 6;
  if(z<14)return 18;
  if(z<15)return 45;
  if(z<16)return 90;
  return 160;
}

/* Только видимая область + небольшой запас. На дальнем масштабе серые
   точки почти не показываем: сначала зарядки и наиболее заполненные объекты. */
function visibleParkings(){
  const all=filteredParkings();
  if(!ymap)return all.slice(0,40);
  const b=ymap.getBounds();
  if(!b)return all.slice(0,40);
  const latPad=Math.abs(b[1][0]-b[0][0])*.16;
  const lngPad=Math.abs(b[1][1]-b[0][1])*.16;
  const minLat=Math.min(b[0][0],b[1][0])-latPad,maxLat=Math.max(b[0][0],b[1][0])+latPad;
  const minLng=Math.min(b[0][1],b[1][1])-lngPad,maxLng=Math.max(b[0][1],b[1][1])+lngPad;
  const z=ymap.getZoom();
  const c=ymap.getCenter();
  let list=all.filter(p=>p.lat>=minLat&&p.lat<=maxLat&&p.lng>=minLng&&p.lng<=maxLng);
  // Серые точки без данных сильнее всего перегружают карту.
  if(z<13) list=list.filter(p=>p.price_type!=='unknown'||p.ev||p.category==='EV_STATION'||p.closed);
  else if(z<15){
    let greyCount=0;
    list=list.filter(p=>{
      if(p.price_type!=='unknown')return true;
      if(p.ev||p.category==='EV_STATION'||p.closed)return true;
      return greyCount++<18;
    });
  }

  list.sort((a,b)=>{
    const score=p=>{
      let s=0;
      if(String(p.id)===String(selectedId))s+=100000;
      if(p.ev||p.category==='EV_STATION')s+=5000;
      if(p.closed)s+=2500;
      if(p.price_type==='paid'||p.price_type==='free')s+=700;
      if(p.cap)s+=250;
      if(p.name&&p.name!=='Парковка')s+=180;
      if(p.source&&p.source!=='OpenStreetMap')s+=120;
      if(z<=12&&p.price_type==='unknown')s-=900;
      s-=dist(c[0],c[1],p.lat,p.lng)*8;
      return s;
    };
    return score(b)-score(a);
  });
  return list.slice(0,markerLimitByZoom(z));
}

function markerZoomBucket(){
  const z=ymap?ymap.getZoom():13;
  return z<12?'z11':z<13?'z12':z<14?'z13':z<15?'z14':z<16?'z15':'z16';
}
function scheduleMarkerDraw(){
  clearTimeout(markerDrawTimer);
  if(markerDrawFrame)cancelAnimationFrame(markerDrawFrame);
  markerDrawTimer=setTimeout(()=>{
    markerDrawFrame=requestAnimationFrame(()=>{
      markerDrawFrame=0;
      drawMarkers(false);
    });

function findNearestVisibleParking(coords,maxPx){
  if(!ymap||!coords)return null;
  const zoom=ymap.getZoom();
  const projection=ymap.options.get('projection')||ymaps.projection.wgs84Mercator;
  const target=projection.toGlobalPixels(coords,zoom);
  let best=null,bestD=maxPx;
  visibleParkingMap.forEach(p=>{
    const px=projection.toGlobalPixels([p.lat,p.lng],zoom);
    const d=Math.hypot(px[0]-target[0],px[1]-target[1]);
    if(d<bestD){bestD=d;best=p}
  });
  return best;
}

  if(!ymap)return;
  ensureObjectManager();
  const wanted=visibleParkings().filter(p=>!streetSegmentIds.has(String(p.id)));
  visibleParkingMap=new Map(wanted.map(p=>[String(p.id),p]));
  const theme=document.documentElement.getAttribute('data-theme')||'light';
  const zoomBucket=markerZoomBucket();
  const signature=theme+'|'+zoomBucket+'|'+String(selectedId||'')+'|'+wanted.map(p=>String(p.id)).join(',');
  if(!force&&signature===lastMarkerSignature)return;
  lastMarkerSignature=signature;

  const features=wanted.map(p=>({
    type:'Feature',
    id:String(p.id),
    geometry:{type:'Point',coordinates:[p.lat,p.lng]},
    properties:{parkingId:String(p.id)},
    options:markerOptions(p,String(p.id)===String(selectedId))
  }));
  const wantedIds=new Set(features.map(f=>String(f.id))),current=[];
  objectManager.objects.each(obj=>current.push(String(obj.id)));
  const removals=current.filter(id=>!wantedIds.has(id));if(removals.length)objectManager.remove(removals);
  const additions=[];
  features.forEach(feature=>{
    const old=objectManager.objects.getById(feature.id);
    if(!old)additions.push(feature);else objectManager.objects.setObjectOptions(feature.id,feature.options);
  });
  if(additions.length)objectManager.add({type:'FeatureCollection',features:additions});
  lastMarkerZoomBucket=zoomBucket;
}
let prevSelected=null;
function updateSelection(id){
  if(!objectManager){prevSelected=id;return}
  [prevSelected,id].forEach(pid=>{
    if(pid==null)return;
    const p=visibleParkingMap.get(String(pid))||PARKINGS.find(x=>String(x.id)===String(pid));
    if(!p)return;
    try{objectManager.objects.setObjectOptions(String(pid),markerOptions(p,String(pid)===String(id)))}catch(e){}
  });
  prevSelected=id;
  lastMarkerSignature='';
}
function selectParking(id){

function priceLabel(p){return p.price_type==='free'?t('free'):(p.price_text||'—')}
function freePeriodLabel(minutes){
  const value=Number(minutes);
  if(!Number.isFinite(value)||value<=0)return 'Бесплатный период';
  const hours=Math.floor(value/60),mins=value%60;
  const duration=(hours?hours+' ч':'')+(hours&&mins?' ':'')+(mins?mins+' мин':'');
  return duration+' бесплатно';
}
function afterFreePeriodLabel(p){
  const value=Number(p.price_after_free_period);
  if(p.price_after_free_period==null||!Number.isFinite(value))return '';
  const units={hour:'за час',started_hour:'за начатый час',entry:'после периода',day:'за сутки',custom:'по условиям парковки'};
  const unit=units[p.price_after_free_period_unit]||'';
  return 'После — '+value.toLocaleString('ru-RU')+' сум'+(unit?' '+unit:'');
}
function parkingBadgesHtml(p,compact=false){
  const badges=[];
  if(p.has_barrier)badges.push(['primary','🚧 Шлагбаум']);
  if(p.has_free_period)badges.push(['primary','🕐 '+freePeriodLabel(p.free_period_minutes)]);
  if(p.requires_purchase)badges.push(['warn','Покупка обязательна']);
  if(p.requires_receipt)badges.push(['warn','Нужен чек']);
  const after=afterFreePeriodLabel(p);if(after&&!compact)badges.push(['warn',after]);
  return badges.length?'<div class="parking-badges'+(compact?' fav-access':'')+'">'+badges.map(x=>'<span class="parking-badge '+x[0]+'">'+escapeHtml(x[1])+'</span>').join('')+'</div>':'';
}
function parkingTermsHtml(p){
  if(!p.has_barrier&&!p.has_free_period&&!p.requires_purchase&&!p.requires_receipt)return '';
  const rows=[];
  if(p.has_barrier){
    const positions=[];if(p.barrier_at_entry)positions.push('на въезде');if(p.barrier_at_exit)positions.push('на выезде');
    rows.push(['Доступ','Шлагбаум'+(positions.length?' '+positions.join(' и '):'')]);
  }
  if(p.has_free_period)rows.push(['Бесплатный период',freePeriodLabel(p.free_period_minutes).replace(' бесплатно','')]);
  const after=afterFreePeriodLabel(p);if(after)rows.push(['Дальнейший тариф',after.replace('После — ','')]);
  if(p.requires_purchase)rows.push(['Условие','Требуется покупка']);
  if(p.requires_receipt)rows.push(['Подтверждение','Требуется чек']);
  if(p.requires_ticket)rows.push(['Въезд/выезд','Требуется парковочный билет']);
  const notes=[];
  if(p.entry_rules)notes.push('Въезд: '+p.entry_rules);
  if(p.exit_rules)notes.push('Выезд: '+p.exit_rules);
  if(p.tariff_note)notes.push(p.tariff_note);

  if(p.tariff_source_ref)notes.push('Источник: '+p.tariff_source_ref);
  return '<div class="parking-terms"><h3>Условия парковки</h3>'
    +rows.map(row=>'<div class="parking-term-row"><span>'+escapeHtml(row[0])+'</span><b>'+escapeHtml(row[1])+'</b></div>').join('')
    +notes.map(note=>'<div class="parking-term-note">'+escapeHtml(note)+'</div>').join('')+'</div>';

async function ensurePermission(){
  const Geo=GeoPlugin();
  if(Geo){
    try{
      let p=await Geo.checkPermissions();
      if(p.location!=='granted'&&p.coarseLocation!=='granted'){
        p=await Geo.requestPermissions();
        if(p.location!=='granted'&&p.coarseLocation!=='granted')return false;
      }
      return true;
    }catch(e){return true}
  }
  return (await permState())!=='denied';
}

/* применяем координату, если она лучше текущей */
let lastFixTs=0;
const GPS_GOOD=60;      // настоящий спутниковый замер — до 60 м
const ROUGH_OVER=100;   // всё, что хуже 100 м, показываем как приблизительное
const JUNK_OVER=2500;    // хуже 2.5 км — это определение по IP, ему верить нельзя
function applyFix(lat,lng,acc,label,precise,heading,speed){
  // мусорный замер (IP-геолокация) не показываем вовсе, если уже есть что-то лучше
  if(acc>JUNK_OVER&&mePos&&meAcc&&meAcc<acc)return false;
  const stale = Date.now()-lastFixTs>20000;   // старый замер устарел — берём любой новый
  const movingFix=routeGuidanceActive&&acc<=Math.max(120,(meAcc||60)*2.5);
  const better = movingFix || !mePos || !meAcc || acc<=meAcc*0.8 || (precise&&!gpsGot) || stale;
  if(!better)return false;
  lastFixTs=Date.now();
  meSpeed=Number.isFinite(speed)&&speed>0?speed:0;
  if(Number.isFinite(heading)&&heading>=0&&(meSpeed>.6||meHeading==null)){
    const delta=((heading-(meHeading==null?heading:meHeading)+540)%360)-180;
    meHeading=(meHeading==null?heading:(meHeading+delta*.35)+360)%360;
  }
  if(!dbReloadedForUser && acc<3000){ dbReloadedForUser=true; loadParkingsFromDB(lat,lng,15000); }
  const jumped = mePos ? dist(mePos.lat,mePos.lng,lat,lng)>0.2 : true;
  putMe(lat,lng,acc,acc>ROUGH_OVER);
  if(acc<=1000)saveLastPos(lat,lng,acc);
  if(precise)gpsGot=true;
  // Парковочные метки обновляем только при заметном перемещении пользователя.
  if(jumped)scheduleMarkerDraw();
  // переезжаем, если пользователь сам карту не двигал
  if(!userPanned&&(jumped||precise)) ymap&&ymap.setCenter([lat,lng],zoomFor(acc),{duration:450});
  if(label)toast(label+(acc>ROUGH_OVER?' · '+t('approxTilde'):'')+' · ±'+(acc>1000?Math.round(acc/1000)+' км':Math.round(acc)+' м'));
  updateRouteGuidance();
  return true;
}

/* МГНОВЕННО: последняя известная позиция от системы (от любого приложения).
   ВАЖНО: ограничиваем возраст 10 минутами — иначе Android может отдать
   координату многочасовой давности из совсем другого места (ложная "ошибка в 5 км"). */
function instantFix(){
  const Geo=GeoPlugin();
  const o={enableHighAccuracy:false,timeout:3000,maximumAge:600000};
  const wrap=p=>({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});
  return (Geo?Geo.getCurrentPosition(o):getPos(o)).then(wrap);
}

/* быстрый замер: сеть/вышки. Кэш системы разрешаем только совсем свежий (30 сек) */
function fastFix(){
  const Geo=GeoPlugin();
  // в браузере низкая точность = определение по IP (промах в километры),
  // поэтому в вебе сразу просим высокую точность
  const o={enableHighAccuracy:!GeoPlugin(),timeout:7000,maximumAge:30000};
  const wrap=p=>({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});
  return (Geo?Geo.getCurrentPosition(o):getPos(o)).then(wrap);
}

/* КОМПАС: конус направления поворачивается вслед за телефоном */
let meHeading=null, headingInit=false;
function initHeading(){
  if(headingInit)return; headingInit=true;
  const onOrient=e=>{
    let deg=null;
    if(e.webkitCompassHeading!=null)deg=e.webkitCompassHeading;          // iOS
    else if(e.alpha!=null)deg=(e.absolute!==false)?(360-e.alpha):(360-e.alpha);
    if(deg==null||isNaN(deg))return;
    if(meHeading!=null&&Math.abs(deg-meHeading)<4)return;                // не дёргаем на мелочи
    meHeading=deg;
    const el=document.querySelector('.me-cone');
    if(el)el.style.transform='rotate('+Math.round(deg)+'deg)';
    else if(mePos)putMe(mePos.lat,mePos.lng,meAcc);                      // конуса ещё нет — перерисуем
    const cs=document.getElementById('compassSvg');
    if(cs)cs.style.transform='rotate('+Math.round(deg)+'deg)';
  };
  window.addEventListener('deviceorientationabsolute',onOrient,true);
  window.addEventListener('deviceorientation',onOrient,true);
}
/* На iOS компас не заработает без явного разрешения, которое браузер
   выдаёт ТОЛЬКО в ответ на тап пользователя — поэтому кнопка компаса
   сама запрашивает его, а не пытается получить доступ автоматически. */
let compassMode=false;
document.getElementById('compassbtn').onclick=async()=>{
  const btn=document.getElementById('compassbtn');
  const DOE=window.DeviceOrientationEvent;
  if(DOE && typeof DOE.requestPermission==='function'){
    try{
      const res=await DOE.requestPermission();
      if(res!=='granted'){toast('Нет доступа к компасу');return}
    }catch(e){}
  }
  initHeading();
  compassMode=!compassMode;
  btn.classList.toggle('on',compassMode);
  if(compassMode){
    if(mePos&&ymap)ymap.panTo([mePos.lat,mePos.lng],{duration:300});
    toast(meHeading==null?'Компас включён. Поворачивайте телефон':'Компас включён');
  }else{
    const cs=document.getElementById('compassSvg');
    if(cs)cs.style.transform='rotate(0deg)';
    toast('Компас выключен');
  }
};

/* живой показ точности — видно, как GPS сходится к нескольким метрам */
let accHintShown=false, accStart=0;
function showAcc(acc){
  const el=document.getElementById('accbadge');if(!el)return;
  el.textContent='±'+(acc>=1000?(acc/1000).toFixed(1)+' км':Math.round(acc)+' м');
  el.className='accbadge on '+(acc<=GPS_GOOD?'good':'bad');
  if(!accStart)accStart=Date.now();
  // если через 30 сек точность всё ещё плохая — честно подсказываем, что делать
  if(!accHintShown&&acc>ROUGH_OVER&&Date.now()-accStart>30000){
    accHintShown=true;toast(t('geoImprove'));
  }
}

/* точный GPS: постоянно слушаем, уточняем точку */
async function startPreciseWatch(){
  if(watchId!=null||precising)return;precising=true;
  const Geo=GeoPlugin();
  const o={enableHighAccuracy:true,timeout:45000,maximumAge:0};
  const onFix=p=>{
    if(!p||!p.coords)return;
    const acc=p.coords.accuracy;
    const first=!gpsGot&&acc<=GPS_GOOD;
    applyFix(p.coords.latitude,p.coords.longitude,acc,first?t('geoPrecise'):null,acc<=GPS_GOOD,p.coords.heading,p.coords.speed);
    showAcc(acc);
  };
  try{
    if(Geo) watchId=await Geo.watchPosition(o,onFix);
    else watchId=navigator.geolocation.watchPosition(onFix,()=>{},o);
    document.getElementById('locbtn').classList.add('live');
  }catch(e){precising=false}
}

/* главная: сеть и GPS запускаются ОДНОВРЕМЕННО, кто быстрее — тот и показан */
async function locate(silent){
  userPanned=false;
  if(!GeoPlugin()&&!navigator.geolocation){if(!silent)toast(t('geoNo'));return false}
  if(!isNative&&!GeoPlugin()&&location.protocol!=='https:'&&location.hostname!=='localhost'){if(!silent)toast(t('geoHttp'));return false}

  // мгновенно: последняя точная точка из кэша
  const cached=loadLastPos();
  if(cached&&!mePos){putMe(cached.lat,cached.lng,cached.acc);drawMarkers();
    if(ymap)ymap.setCenter([cached.lat,cached.lng],zoomFor(cached.acc));
    if(!silent)toast(t('geoCached'))}
  else if(!silent)toast(t('geoing'));

  const ok=await ensurePermission();
  if(!ok){if(!silent)toast(t('geoDeny'));return false}

  gpsGot=false;
  startPreciseWatch();                       // GPS стартует СРАЗУ, не ждёт сеть

  // МГНОВЕННО: системная последняя позиция (обычно 0-100 мс)
  instantFix().then(i=>{
    if(gpsGot)return;
    applyFix(i.lat,i.lng,i.acc,silent?null:(i.acc<=ROUGH_OVER?t('geoOk'):t('geoRoughWait')),false);
  }).catch(()=>{});

  // сеть — как быстрая заглушка, пока GPS ищет спутники
  fastFix().then(f=>{
    if(gpsGot)return;                        // GPS уже успел — грубую не показываем
    applyFix(f.lat,f.lng,f.acc,silent?null:(f.acc>1000?t('geoRoughWait'):t('geoOk')),false);
  }).catch(e=>{
    if(e&&e.code===1&&!silent)toast(t('geoDeny'));
  });

  // если через 25 сек GPS так и не поймал — честно говорим
  setTimeout(()=>{ if(!gpsGot&&!silent&&mePos&&meAcc>500)toast(t('geoStillRough')) },25000);

  // совсем нет ничего — грубо по IP через Яндекс
  setTimeout(async()=>{
    if(mePos)return;
    try{const y=await yandexGeo();applyFix(y.lat,y.lng,y.acc,silent?null:t('geoRough'),false)}catch(e){}
  },8000);

  return true;
}

/* если пользователь сам двигает карту — перестаём её перецентровывать */
function trackPan(){ if(!ymap)return;
  ymap.events.add('actionbegin',()=>{userPanned=true});
}

async function centerOnMyLocation(){
  userPanned=false;

  if(mePos&&ymap){
    ymap.setCenter([mePos.lat,mePos.lng],zoomFor(meAcc||60),{duration:350});
  }
  await locate(true);
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(mePos&&ymap){
      ymap.setCenter([mePos.lat,mePos.lng],zoomFor(meAcc||60),{duration:300});
      clearInterval(timer);
      toast(t('geoOk'));
    }else if(tries>=12){

    }

  setTimeout(()=>btn.classList.remove('on'),900);
}

/* ═══════════ МАРШРУТ ВНУТРИ PARKLY ═══════════ */
let route=null,routeTarget=null,routeMode='auto',routeInfo=null,routeAlternative=0;
let routeGuidanceActive=false,lastRouteRefreshAt=0,lastRouteOrigin=null,routeRequestAbort=null,lastRouteDeviationToast=0;

const routeCache=new Map(),ROUTE_CACHE_MS=5*60*1000;

function formatRouteDuration(s){const min=Math.max(1,Math.round(s/60));return min<60?min+' мин':Math.floor(min/60)+' ч '+(min%60?min%60+' мин':'')}
async function fetchRoadRoutes(origin,target,mode){
  const key=routeCacheKey(origin,target,mode),cached=routeCache.get(key);

  const res=await fetch(SUPABASE_URL+'/functions/v1/parkly-route',{
    method:'POST',signal:routeRequestAbort.signal,
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    body:JSON.stringify({mode:mode==='pedestrian'?'foot':'car',origin:[origin.lng,origin.lat],destination:[target.lng,target.lat],alternatives:3})
  });
  const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'route_request_failed');

function drawRoadRoutes(routes,active){

  routes.map((item,index)=>({item,index})).sort((a,b)=>(a.index===active?1:0)-(b.index===active?1:0)).forEach(({item,index})=>{
    const id='parkly-route-'+index,activeLine=index===active;

    routeBetaMap.addLayer({id,type:'line',source:id,layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':activeLine?(routeMode==='pedestrian'?'#16A34A':'#2563EB'):'#94A3B8','line-width':activeLine?7:4,'line-opacity':activeLine?0.96:0.64}});

  }
}
async function initRouteBetaMap(target){
  if(!window.maplibregl)throw new Error('MapLibre не загрузился');
  if(!routeBetaMap){routeBetaMap=new maplibregl.Map({container:'routeBetaMap',style:ROUTE_TILE_STYLE,center:[target.lng,target.lat],zoom:13,attributionControl:true});routeBetaMap.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');routeBetaMap.on('dragstart',()=>{userPanned=true});await new Promise((resolve,reject)=>{routeBetaMap.once('load',resolve);routeBetaMap.once('error',event=>reject(event.error||new Error('Карта маршрута не загрузилась')))})}
  routeBetaStartMarker?.remove();routeBetaEndMarker?.remove();routeBetaUserMarker?.remove();
  const start=document.createElement('div');start.className='route-beta-marker start';const end=document.createElement('div');end.className='route-beta-marker end';
  routeBetaStartMarker=new maplibregl.Marker({element:start}).setLngLat([mePos.lng,mePos.lat]).addTo(routeBetaMap);
  routeBetaEndMarker=new maplibregl.Marker({element:end}).setLngLat([target.lng,target.lat]).addTo(routeBetaMap);
}
async function openRouteBeta(target,mode){
  if(!target)return;if(!mePos){toast(t('needGeoRoute'));const ok=await locate(true);if(!ok||!mePos){toast(t('geoDeny'));return}}
  routeTarget=target;routeMode=mode||routeMode;document.getElementById('minicard').classList.remove('on');
  const screen=document.getElementById('routeBetaScreen');screen.classList.add('on');screen.setAttribute('aria-hidden','false');document.getElementById('bottomnav').classList.add('hidden');document.getElementById('routeBetaDestination').textContent=target.name||target.label||'Маршрут к парковке';
  try{await initRouteBetaMap(target);setTimeout(()=>routeBetaMap.resize(),0);await buildRouteToTarget(target,routeMode)}catch(error){console.warn('Route Beta init failed',error);routeFailed(target)}
}
function centerRouteBetaOnUser(){userPanned=false;if(routeBetaMap&&mePos)routeBetaMap.easeTo({center:[mePos.lng,mePos.lat],zoom:17,duration:300})}
async function routeTo(id){const p=PARKINGS.find(x=>x.id===id);if(p)requestNavigation(p)}
function routeToSelectedPoint(){if(selectedDestination)requestNavigation({...selectedDestination})}
function requestNavigation(target){const preferred=localStorage.getItem('parkly_navigation_provider');if(preferred)launchNavigationProvider(preferred,target);else openNavigationChooser(target)}
function isAppleDevice(){return /iPad|iPhone|iPod|Macintosh/i.test(navigator.userAgent)}
function navigationUrl(provider,target,mode='auto'){
  const destination=`${Number(target.lat).toFixed(6)},${Number(target.lng).toFixed(6)}`,origin=mePos?`${mePos.lat.toFixed(6)},${mePos.lng.toFixed(6)}`:'';
  if(provider==='google'){const q=new URLSearchParams({api:'1',destination,travelmode:mode==='pedestrian'?'walking':'driving',dir_action:'navigate'});if(origin)q.set('origin',origin);return 'https://www.google.com/maps/dir/?'+q}
  if(provider==='apple'){const q=new URLSearchParams({daddr:destination,dirflg:mode==='pedestrian'?'w':'d'});if(origin)q.set('saddr',origin);return 'https://maps.apple.com/?'+q}
  const points=origin?`${origin}~${destination}`:destination;return `https://yandex.com/maps/?rtext=${encodeURIComponent(points)}&rtt=${mode==='pedestrian'?'pd':'auto'}`;
}
function openNavigationChooser(target){
  routeTarget=target;const preferred=localStorage.getItem('parkly_navigation_provider')||'external-yandex';
  document.getElementById('mask').classList.add('open');const s=document.getElementById('sheet');
  s.innerHTML='<div class="grabber"><i></i></div><div class="filt-head"><h2>Как построить маршрут?</h2><button class="x" onclick="closeSheet()">✕</button></div>'
    +'<div class="route-provider-list">'
    +(NAVIGATION_CONFIG.ors?'<button class="route-provider beta" onclick="chooseNavigationProvider(\'ors\')"><span class="provider-icon">➤</span><span><strong>Внутри Parkly — Beta</strong><small>Маршрут без пробок на отдельной карте OpenStreetMap</small></span></button>':'')
    +'<button class="route-provider" onclick="chooseNavigationProvider(\'external-yandex\')"><span class="provider-icon">Я</span><span><strong>Яндекс Навигатор</strong><small>Пробки, голосовые подсказки и перестроение</small></span></button>'
    +'<button class="route-provider" onclick="chooseNavigationProvider(\'google\')"><span class="provider-icon">G</span><span><strong>Google Maps</strong><small>Открыть маршрут во внешней карте</small></span></button>'
    +(isAppleDevice()?'<button class="route-provider" onclick="chooseNavigationProvider(\'apple\')"><span class="provider-icon"></span><span><strong>Apple Maps</strong><small>Доступно на устройствах Apple</small></span></button>':'')+'</div>'
    +'<label class="route-choice-check"><input id="rememberNavProvider" type="checkbox" '+(preferred?'checked':'')+'> Использовать выбранный вариант по умолчанию</label>'

}
function chooseNavigationProvider(provider){
  const remember=document.getElementById('rememberNavProvider')?.checked;if(remember)localStorage.setItem('parkly_navigation_provider',provider);else localStorage.removeItem('parkly_navigation_provider');
  closeSheet();launchNavigationProvider(provider,routeTarget);
}
function launchNavigationProvider(provider,target){if(provider==='ors')openRouteBeta(target,routeMode);else{window.open(navigationUrl(provider,target,routeMode),'_blank','noopener');toast('Маршрут открыт во внешнем навигаторе')}}
async function buildRouteToTarget(p,mode){
  if(!routeOrigin()){toast(t('needGeoRoute'));const ok=await locate(true);if(!ok||!routeOrigin()){toast(t('geoDeny'));return}}
  routeTarget=p;routeMode=mode||routeMode;document.getElementById('minicard').classList.remove('on');clearRoute();drawRoutePanel(null);
  const origin=routeOrigin();lastRouteOrigin={lat:origin.lat,lng:origin.lng};routeAlternative=0;
  try{const data=await fetchRoadRoutes(origin,p,routeMode);if(routeTarget!==p)return;drawRoadRoutes(data.routes,0);const a=data.routes[0];routeInfo={dist:formatRouteDistance(a.distance),time:formatRouteDuration(a.duration),alternatives:data.routes.length};drawRoutePanel(routeInfo)}
  catch(error){if(error.name!=='AbortError'){console.warn('Road route failed',error);routeFailed(p)}}
}
function routeFailed(p){
  clearRoute();routeInfo={error:true,dist:'—',time:'—',alternatives:0};drawRoutePanel(routeInfo);toast(t('routeUnavailable'));
}
function clearRoute(){
  if(routeBetaMap&&route){route.alternatives.forEach((_,index)=>{const id='parkly-route-'+index;if(routeBetaMap.getLayer(id))routeBetaMap.removeLayer(id);if(routeBetaMap.getSource(id))routeBetaMap.removeSource(id)});if(routeBetaMap.getLayer('parkly-route-done'))routeBetaMap.removeLayer('parkly-route-done');if(routeBetaMap.getSource('parkly-route-done'))routeBetaMap.removeSource('parkly-route-done')}
  route=null;
}
function closeRoute(){stopRouteGuidance(true);clearRoute();routeTarget=null;routeInfo=null;routeBetaStartMarker?.remove();routeBetaEndMarker?.remove();routeBetaUserMarker?.remove();routeBetaStartMarker=routeBetaEndMarker=routeBetaUserMarker=null;document.getElementById('minicard').classList.remove('on');document.getElementById('routeBetaScreen').classList.remove('on');document.getElementById('routeBetaScreen').setAttribute('aria-hidden','true');document.getElementById('bottomnav').classList.remove('hidden')}
function selectRouteAlternative(index){
  if(!route||!route.alternatives||!route.alternatives[index])return;const alternatives=route.alternatives;routeAlternative=index;drawRoadRoutes(alternatives,index);
  const r=alternatives[index];routeInfo={dist:formatRouteDistance(r.distance),time:formatRouteDuration(r.duration),alternatives:alternatives.length};drawRoutePanel(routeInfo);
}
async function startRouteGuidance(){if(!routeTarget||!routeInfo||routeInfo.error)return;if(!mePos){toast(t('needGeoRoute'));await locate(true);if(!mePos)return}routeGuidanceActive=true;selectedStart=null;userPanned=false;lastRouteRefreshAt=Date.now();lastRouteOrigin={lat:mePos.lat,lng:mePos.lng};initHeading();await startPreciseWatch();centerRouteBetaOnUser();drawRoutePanel(routeInfo)}
function stopRouteGuidance(silent){routeGuidanceActive=false;if(!silent)toast('Сопровождение остановлено');if(routeTarget)drawRoutePanel(routeInfo)}
function updateRouteGuidance(){
  if(!routeGuidanceActive||!routeTarget||!mePos)return;const directLeft=dist(mePos.lat,mePos.lng,routeTarget.lat,routeTarget.lng),progress=routeProgressState(),left=progress.remaining;
  if(directLeft<0.04){toast(t('routeArrived'));stopRouteGuidance(true)}
  const now=Date.now();
  const offRoute=progress.deviation>Math.max(.045,(meAcc||30)/1000*1.5);
  if(offRoute&&now-lastRouteRefreshAt>15000){
    if(offRoute&&now-lastRouteDeviationToast>15000){toast('Перестраиваю маршрут');lastRouteDeviationToast=now}
    lastRouteRefreshAt=now;retryActiveRoute();return;
  }
  updateRouteBetaProgress(progress.nearest||0);drawRoutePanel(Object.assign({},routeInfo,{progress:left<1?Math.round(left*1000)+' м':left.toFixed(1)+' км'}));if(!userPanned&&routeBetaMap)routeBetaMap.easeTo({center:[mePos.lng,mePos.lat],duration:220});
}
function retryActiveRoute(){if(!routeTarget)return;return buildRouteToTarget({...routeTarget},routeMode)}
function routeProgressState(){
  const geometry=route&&route.alternatives&&route.alternatives[routeAlternative]&&route.alternatives[routeAlternative].geometry;if(!geometry||!geometry.length){const direct=dist(mePos.lat,mePos.lng,routeTarget.lat,routeTarget.lng);return{remaining:direct,deviation:0}}
  let nearest=0,best=Infinity;geometry.forEach((c,i)=>{const d=dist(mePos.lat,mePos.lng,c[1],c[0]);if(d<best){best=d;nearest=i}});let km=best;
  for(let i=nearest;i<geometry.length-1;i++)km+=dist(geometry[i][1],geometry[i][0],geometry[i+1][1],geometry[i+1][0]);return{remaining:km,deviation:best,nearest};
}
function updateRouteBetaProgress(nearest){
